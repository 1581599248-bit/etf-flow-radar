<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="基于交易所真实ETF份额与同日单位净值的证据优先每日研究看板。"><title>资金ETF流动每日跟踪｜真实数据日报</title><link rel="stylesheet" href="styles.css"></head>
<body><div id="app" class="site"><main class="blocked"><b>REAL DATA</b><h1>正在读取已验证快照…</h1></main></div><script src="html-to-image.js"></script><script>
const fmt=new Intl.NumberFormat("zh-CN",{maximumFractionDigits:2}),money=n=>n==null?"—":`${n>=0?"+":"−"}${Math.abs(n).toFixed(2)} 亿`,tone=n=>n>0?"up":n<0?"down":"flat",signed=(n,d=1)=>`${n>=0?"+":"−"}${Math.abs(n).toFixed(d)}`,fullDate=iso=>new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(new Date(`${iso}T12:00:00+08:00`)),esc=v=>String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const stat=(l,v,n,t="flat")=>`<article class="stat"><span>${l}</span><strong class="${t}">${v}</strong><small>${n}</small></article>`,bar=(v,m)=>`<div class="flowbar"><span class="${tone(v)}" style="${v>=0?"left":"right"}:50%;width:${Math.max(2,Math.abs(v)/Math.max(m,.01)*48)}%"></span><i></i></div>`;
function quadrant(rows){const limit=Math.max(...rows.map(x=>Math.abs(x.flowIntensityBps)),100)*1.12;return `<div class="quadrant-wrap"><div class="quadrant"><span class="q-label q-tl">少数大额流出</span><span class="q-label q-tr">广泛流入</span><span class="q-label q-bl">广泛流出</span><span class="q-label q-br">少数大额流入</span><i class="q-axis q-axis-x"></i><i class="q-axis q-axis-y"></i>${rows.map(r=>{const l=50+r.flowIntensityBps/limit*45,t=50-Math.max(-60,Math.min(60,r.breadthScore))/60*43,s=8+Math.min(8,Math.log10(Math.max(r.aum,10))*2);return `<button class="q-point ${tone(r.flow1d)}" style="left:${l}%;top:${t}%;width:${s}px;height:${s}px" title="${r.name}｜强度 ${signed(r.flowIntensityBps)}bp｜广度 ${signed(r.breadthScore)}%"><span>${r.name}</span></button>`}).join("")}<span class="axis-name axis-x">净申赎强度（bp / 估算AUM）→</span><span class="axis-name axis-y">ETF申赎广度 →</span></div><div class="chart-legend"><span><i class="dot up"></i>聚合净流入</span><span><i class="dot down"></i>聚合净流出</span><span>气泡大小：估算AUM</span></div></div>`}
async function load(){try{const r=await fetch(`data/latest.json?t=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();if(d.schemaVersion<3||d.sourceMode!=="REAL"||d.status==="failed")throw Error("当前快照未通过新版研究口径");render(d)}catch(e){document.getElementById("app").innerHTML=`<main class="blocked"><b>数据未发布</b><h1>没有通过新版研究口径的真实快照</h1><p>${esc(e.message||e)}</p><small>系统不会回退到模拟数据或旧口径结论。</small></main>`}}
function render(d){const rows=d.indices,sorted=[...rows].sort((a,b)=>b.flow1d-a.flow1d),total=rows.reduce((s,x)=>s+x.flow1d,0),gross=rows.reduce((s,x)=>s+Math.abs(x.flow1d),0),poolAum=rows.reduce((s,x)=>s+x.aum,0),inflow=rows.filter(x=>x.flow1d>0).length,outflow=rows.filter(x=>x.flow1d<0).length,pos=rows.reduce((s,x)=>s+x.inflowEtfCount,0),neg=rows.reduce((s,x)=>s+x.outflowEtfCount,0),n=rows.reduce((s,x)=>s+x.etfCount,0),breadth=(pos-neg)/n*100,topOut=[...rows].sort((a,b)=>a.flow1d-b.flow1d),pressure=(Math.abs(topOut[0].flow1d)+Math.abs(topOut[1].flow1d))/gross*100,large=rows.filter(x=>["000016","000300","000510"].includes(x.code)),hist=Math.max(...rows.map(x=>x.spark.length)),max=Math.max(...rows.map(x=>Math.abs(x.flow1d)),1),a500=rows.find(x=>x.code==="000510"),s50=rows.find(x=>x.code==="000016");
document.getElementById("app").innerHTML=`<nav class="nav"><div class="mark">E</div><div class="nav-title"><strong>资金ETF流动每日跟踪</strong><span>ETF FLOW RESEARCH</span></div><div class="nav-links"><a href="#thesis">结论</a><a href="#coordinate">坐标</a><a href="#indices">明细</a><a href="#quality">口径</a></div><button id="export" data-export-hide="true">导出高清 JPG</button></nav><div class="report" id="report">
<header class="report-head"><div><p>A-SHARE ETF CAPITAL FLOW · EVIDENCE FIRST</p><h1>资金ETF流动每日跟踪</h1><span class="head-scope">核心指数ETF观察池 · 非全市场资金流 · 非投资主体识别</span></div><div class="analysis-date"><span>每日分析日期</span><strong>${fullDate(d.tradeDate)}</strong><small>生成于 ${new Date(d.generatedAt).toLocaleString("zh-CN",{hour12:false})}</small></div></header>
<section class="trust-strip"><b><i></i>真实数据已验证</b><span>全市场份额 ${fmt.format(d.quality.marketEtfCount)} 只</span><span>纯基准映射 ${d.quality.mappedEtfCount} 只</span><span>同日价格覆盖 ${(d.quality.priceCoverage*100).toFixed(2)}%</span><span>T−1 ${d.previousTradeDate}</span></section>
<section class="thesis" id="thesis"><div class="thesis-main"><div class="eyebrow"><span>今日结论</span><b>C级｜单日观察，趋势未确认</b></div><h2>压力集中在成长与中小盘，大盘内部明显分化，不能概括为“资金偏向大盘”。</h2><p>9 个核心指数ETF观察池合计估算净流出 <strong class="${tone(total)}">${money(total)}</strong>；${topOut[0].name}与${topOut[1].name}流出居前。${large.map(x=>`${x.name} ${money(x.flow1d)}`).join("、")}，方向并不一致。</p></div><div class="evidence-grid"><article><span>发生了什么</span><b>${outflow} / ${rows.length}</b><p>指数方向净流出；观察池申赎广度 ${signed(breadth)}%</p></article><article><span>压力在哪里</span><b>${topOut[0].name} · ${topOut[1].name}</b><p>两者占观察池绝对资金变化 ${pressure.toFixed(1)}%</p></article><article><span>关键反证</span><b>大盘不是同向信号</b><p>上证50、A500流入，但沪深300流出</p></article><article><span>证据强度</span><b>仅 ${hist} 个交易日</b><p>5日、20日与250日位置均不可判断</p></article></div><div class="decision-line"><span><b>可以确认</b> 当日哪些观察池发生份额增减</span><span><b>不能确认</b> 国家队或任何投资者身份、持续趋势、未来收益</span><span><b>下一步确认</b> 连续5日方向、申赎广度扩散、集中度是否下降</span></div></section>
<section class="stats-grid">${stat("观察池合计净流",money(total),"指数暴露重叠，不等于全市场净流",tone(total))}${stat("绝对资金变化",`${gross.toFixed(2)} 亿`,"流入与流出绝对值之和")}${stat("观察池估算AUM",`${fmt.format(poolAum)} 亿`,"T日份额 × T日单位净值")}${stat("指数方向分布",`${inflow} 入 / ${outflow} 出`,`${rows.length} 个核心指数`)}${stat("产品申赎广度",`${signed(breadth)}%`,`${pos}只增 / ${neg}只减 / ${n}只`,tone(breadth))}${stat("历史可用性",`${hist} 日`,"不足则不输出趋势与分位")}</section>
<section class="analysis-grid" id="coordinate"><article class="panel coordinate-panel"><div class="panel-head"><div><span>FLOW COORDINATE</span><h2>资金强度 × 申赎广度</h2><p>横轴衡量相对规模，纵轴检验资金变化是否由多数ETF共同确认</p></div><b class="scope-tag">截面 · ${d.tradeDate}</b></div>${quadrant(rows)}<p class="method-note">强度 = 估算净申赎 ÷ T日估算AUM；广度 =（份额增加ETF数 − 份额减少ETF数）÷ ETF总数。右下象限表示合计流入但多数产品未同步，并非广泛共识。</p></article><aside class="insight-stack"><article class="insight-card"><span>最重要的分化</span><h3>中证A500：净流入，但广度为负</h3><p>合计 ${money(a500.flow1d)}，广度 ${signed(a500.breadthScore)}%。说明少数较大申购覆盖了更多产品的小额赎回，应标注为“集中流入”。</p></article><article class="insight-card"><span>最需要降权的信号</span><h3>上证50：单一产品驱动</h3><p>${s50.dominantEtf.name}贡献该组绝对变化的 ${s50.dominantEtf.grossContributionPct.toFixed(0)}%，不能外推为整个大盘风格共识。</p></article><article class="insight-card boundary"><span>识别边界</span><h3>删除“国家队代理资金”</h3><p>交易所ETF份额只告诉我们总份额变化，无法区分中央汇金、机构、做市商或个人。没有投资者身份数据，就不能给资金贴“国家队”标签。</p></article></aside></section>
<section class="panel" id="indices"><div class="panel-head"><div><span>INDEX EVIDENCE TABLE</span><h2>核心指数证据表</h2><p>同时查看金额、规模化强度、广度和单一产品贡献，避免只看一个总数</p></div></div><div class="flow-table"><div class="flow-tr flow-th"><span>指数 / 代码</span><span>资金方向</span><span>1日净流</span><span>强度 bp</span><span>申赎广度</span><span>产品分布</span><span>主导ETF / 贡献</span><span>5日</span></div>${sorted.map(r=>`<div class="flow-tr"><span><b>${r.name}</b><small>${r.code} · ${r.group}</small></span>${bar(r.flow1d,max)}<strong class="${tone(r.flow1d)}">${money(r.flow1d)}</strong><span class="${tone(r.flowIntensityBps)}">${signed(r.flowIntensityBps)} bp</span><span class="${tone(r.breadthScore)}">${signed(r.breadthScore)}%</span><span>${r.inflowEtfCount}增 / ${r.outflowEtfCount}减 / ${r.unchangedEtfCount}平</span><span><b>${r.dominantEtf.name}</b><small>${r.dominantEtf.grossContributionPct.toFixed(1)}%</small></span><em>${r.flow5d==null?"样本积累中":money(r.flow5d)}</em></div>`).join("")}</div><p class="method-note">本表仅纳入名称可明确识别为对应头条指数的纯基准ETF；增强、指增、价值、成长、红利、低波、等权等策略变体已排除。</p></section>
<section class="lower-grid" id="quality"><article class="panel"><div class="panel-head"><div><span>CONFIRMATION CHECKLIST</span><h2>从“单日现象”升级为“轮动结论”还缺什么</h2></div></div><ol class="checklist"><li><b>持续性</b><span>至少5个交易日累计同向，当前：不可用</span></li><li><b>广度扩散</b><span>同组多数ETF份额同向，当前：仅部分指数满足</span></li><li><b>集中度</b><span>信号不能长期由单只ETF主导，当前：上证50、创业板需降权</span></li><li><b>价格验证</b><span>价格与份额联合判断逆势/趋势流入，当前历史收益字段未接入</span></li></ol></article><article class="panel"><div class="panel-head"><div><span>DATA QUALITY</span><h2>真实数据与发布门禁</h2></div><b class="verified">✓ ${d.status.toUpperCase()}</b></div><div class="quality-grid"><span><b>份额主源</b>SSE / SZSE 日终总份额</span><span><b>价格口径</b>T日单位净值优先</span><span><b>日期锁定</b>${d.previousTradeDate} → ${d.tradeDate}</span><span><b>失败策略</b>不覆盖上一验证快照</span></div><p class="quality-note">${d.quality.issues.map(x=>x.message).join("；")||"全部质量门禁通过"}</p></article></section>
<footer><b>资金ETF流动每日跟踪</b><p>数据来源：上海证券交易所、深圳证券交易所、东方财富公开数据；AKShare 为固定版本采集适配层。估算资金流 =（T日总份额 − T−1日总份额）× T日单位净值。本页展示的是重叠指数观察池，不是全市场净流，也不能识别投资者身份。本报告不构成投资建议。</p><span>分析日期 ${d.tradeDate}</span></footer></div>`;document.getElementById("export").onclick=()=>exportJpg(d.tradeDate)}
async function exportJpg(day){const report=document.getElementById("report"),button=document.getElementById("export");button.textContent="正在生成…";button.disabled=true;report.classList.add("exporting");try{await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const url=await htmlToImage.toJpeg(report,{quality:.98,pixelRatio:2,backgroundColor:"#f1f2f4",cacheBust:true,filter:el=>!(el instanceof HTMLElement&&el.dataset.exportHide==="true")}),a=document.createElement("a");a.href=url;a.download=`资金ETF流动每日跟踪_${day}.jpg`;a.click()}catch(e){alert(`导出失败：${e}`)}finally{report.classList.remove("exporting");button.textContent="导出高清 JPG";button.disabled=false}}
load();</script></body></html>
