<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="基于沪深交易所真实ETF日终份额的A股ETF资金流每日跟踪。">
  <title>资金ETF流动每日跟踪</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><main class="loading"><b>VERIFIED DATA</b><h1>正在读取已验证快照…</h1></main></div>
  <script src="html-to-image.js" onload="window.__imageExportReady=true"></script>
  <script>
  const $=s=>document.querySelector(s), esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
  const money=n=>n==null?"—":`${n>0?"+":n<0?"−":""}${Math.abs(n).toFixed(1)}亿`;
  const pct=n=>n==null?"—":`${n>0?"+":""}${n.toFixed(2)}%`;
  const flowRate=r=>r.flowIntensity5dPct??(r.flowIntensity5dBps==null?null:r.flowIntensity5dBps/100);
  const countText=(r,period="1d")=>`${r[`increaseEtfCount${period}`]??"—"}增 / ${r[`decreaseEtfCount${period}`]??"—"}减`;
  const tone=n=>n>0?"up":n<0?"down":"flat";
  const kindName={broad:"宽基",style:"风格",sector:"行业"};
  const periodKey={"1d":"flow1d","5d":"flow5d","20d":"flow20d"};
  const fullDate=d=>new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(new Date(`${d}T12:00:00+08:00`));

  async function load(){
    try{
      const response=await fetch(`data/latest.json?v=${Date.now()}`,{cache:"no-store"});
      if(!response.ok)throw new Error(`HTTP ${response.status}`);
      const data=await response.json();
      if(data.schemaVersion!==4||data.sourceMode!=="REAL"||data.status==="failed")throw new Error("数据快照未通过发布门禁");
      render(data);
    }catch(error){document.getElementById("app").innerHTML=`<main class="loading error"><b>DATA BLOCKED</b><h1>今日数据暂未发布</h1><p>${esc(error.message)}</p><small>系统会保留上一份验证快照，不使用模拟数据补位。</small></main>`}
  }

  function chart(rows,title,subtitle){
    const usable=rows.filter(r=>r.relativeReturn20d!=null&&flowRate(r)!=null);
    const xMax=Math.max(2,...usable.map(r=>Math.abs(r.relativeReturn20d)))*1.16;
    const yMax=Math.max(.5,...usable.map(r=>Math.abs(flowRate(r))))*1.16;
    const aums=usable.map(r=>r.aum), aMin=Math.min(...aums), aMax=Math.max(...aums);
    return `<article class="panel chart-card"><div class="section-head"><div><span>PRICE × FLOW MAP</span><h2>${title}</h2><p>${subtitle}</p></div><div class="period-note">近20日价格 × 近5日资金</div></div>
      <div class="quadrant">
        <div class="quad-label q1"><b>相对强势 · 持续增配</b><span>趋势强化</span></div><div class="quad-label q2"><b>相对弱势 · 逆势承接</b><span>资金抄底</span></div>
        <div class="quad-label q3"><b>相对弱势 · 持续流出</b><span>风险释放</span></div><div class="quad-label q4"><b>相对强势 · 上涨减配</b><span>获利兑现</span></div>
        <i class="axis axis-x"></i><i class="axis axis-y"></i>
        ${usable.map(r=>{const rate=flowRate(r),left=50+r.relativeReturn20d/xMax*45,top=50-rate/yMax*43,size=12+Math.sqrt((r.aum-aMin+1)/(aMax-aMin+1))*20;return `<button class="bubble ${tone(rate)}" data-id="${r.id}" style="left:${left}%;top:${top}%;width:${size}px;height:${size}px" title="${r.name}｜20日相对收益 ${pct(r.relativeReturn20d)}｜5日资金变化率 ${pct(rate)}"><span>${r.name}</span></button>`}).join("")}
        <span class="axis-title x-title">20日相对沪深300收益 →</span><span class="axis-title y-title">↑ 5日资金变化率（占5日前规模）</span>
      </div>
      <div class="legend"><span><i class="red"></i>5日净流入</span><span><i class="green"></i>5日净流出</span><span>气泡面积 = 当前估算规模</span></div>
    </article>`;
  }

  function summaryCard(r){return `<button class="summary-card" data-id="${r.id}"><div><span>${kindName[r.kind]} · ${r.etfCount}只</span><h3>${r.name}</h3></div><strong class="${tone(r.flow1d)}">${money(r.flow1d)}</strong><div class="periods"><span><b class="${tone(r.flow1d)}">${money(r.flow1d)}</b><small>1日</small></span><span><b class="${tone(r.flow5d)}">${money(r.flow5d)}</b><small>5日</small></span><span><b class="${tone(r.flow20d)}">${money(r.flow20d)}</b><small>20日</small></span></div><footer><span>${r.priceFlowState}</span><b>${pct(flowRate(r))}</b></footer></button>`}

  function ranking(rows,period,limit=6){const key=periodKey[period],sorted=[...rows].sort((a,b)=>b[key]-a[key]);const selected=[...sorted.slice(0,Math.ceil(limit/2)),...sorted.slice(-Math.floor(limit/2)).reverse()];const max=Math.max(...selected.map(r=>Math.abs(r[key])),.1);return `<div class="rank-list">${selected.map(r=>`<button data-id="${r.id}"><span><b>${r.name}</b><small>${kindName[r.kind]} · ${r.priceFlowState}</small></span><div class="rankbar"><i class="${tone(r[key])}" style="width:${Math.abs(r[key])/max*100}%"></i></div><strong class="${tone(r[key])}">${money(r[key])}</strong></button>`).join("")}</div>`}

  function render(data){
    window.snapshot=data;
    const broad=data.groups.filter(r=>r.kind==="broad"), styles=data.groups.filter(r=>r.kind==="style"), sectors=data.groups.filter(r=>r.kind==="sector"), wide=[...broad,...styles];
    const cards=["hs300","csi_a500","csi500","csi1000","chinext","star50"].map(id=>data.groups.find(r=>r.id===id)).filter(Boolean);
    const topIn=[...data.groups].sort((a,b)=>b.flow1d-a.flow1d)[0],topOut=[...data.groups].sort((a,b)=>a.flow1d-b.flow1d)[0];
    document.getElementById("app").innerHTML=`
    <nav><div class="brand-mark">F</div><div class="brand"><b>资金ETF流动每日跟踪</b><span>A-SHARE ETF FLOW MONITOR</span></div><div class="nav-links"><a href="#summary">结论</a><a href="#broad">宽基摘要</a><a href="#maps">资金坐标</a><a href="#detail">明细</a></div><button id="export" data-export-hide="true">导出高清 JPG</button></nav>
    <main id="report" class="report">
      <header class="masthead"><div><span>DAILY CLIENT BRIEF · OFFICIAL CLOSE</span><h1>资金ETF流动每日跟踪</h1><p>真实份额 · 客观变化 · 可复核结论</p></div><div class="analysis-date"><span>数据交易日</span><strong>${fullDate(data.tradeDate)}</strong><small>${data.windowStartDate} — ${data.tradeDate} · 滚动${data.quality.officialSessions}个交易日，更新后自动前移</small></div></header>
      <div class="trust"><span><i></i>${data.status.toUpperCase()} 已通过门禁</span><span>已更新至交易所最新可得日</span><span>交易日20:30 / 23:00、次日09:15自动检查</span><span>${data.quality.classifiedEtfCount}只A股股票ETF</span><span>最后检查 ${esc(data.generatedAt.replace("T"," ").slice(0,19))}</span></div>

      <section id="summary" class="conclusion panel"><div class="section-head"><div><span>TODAY'S ANSWER</span><h2>今日结论</h2></div><b class="confidence">置信度 ${data.conclusion.confidence}</b></div><h3>${esc(data.conclusion.headline)}</h3><div class="facts">${data.conclusion.facts.map((x,i)=>`<article><b>0${i+1}</b><p>${esc(x)}</p></article>`).join("")}</div><div class="view"><b>数据解读</b><p>${esc(data.conclusion.interpretation)}</p></div></section>

      <section class="market-strip"><article><span>观察池当日估算资金变化</span><strong class="${tone(data.market.flow1d)}">${money(data.market.flow1d)}</strong><small>${data.market.etfCount}只互斥归类ETF</small></article><article><span>5日累计资金变化</span><strong class="${tone(data.market.flow5d)}">${money(data.market.flow5d)}</strong><small>观察是否连续</small></article><article><span>20日累计资金变化</span><strong class="${tone(data.market.flow20d)}">${money(data.market.flow20d)}</strong><small>观察中期方向</small></article><article><span>当日ETF增减分布</span><strong>${countText(data.market)}</strong><small>${data.market.unchangedEtfCount1d}只份额不变</small></article><article><span>最大流入组</span><strong class="up">${topIn.name}</strong><small>${money(topIn.flow1d)}</small></article><article><span>最大流出组</span><strong class="down">${topOut.name}</strong><small>${money(topOut.flow1d)}</small></article></section>

      <section id="broad" class="panel"><div class="section-head"><div><span>CORE BROAD INDEXES</span><h2>主要宽基数据摘要</h2><p>先看今天，再用5日和20日辨别一次性申赎还是持续切换</p></div></div><div class="summary-grid">${cards.map(summaryCard).join("")}</div></section>

      <section id="maps" class="map-grid">${chart(wide,"宽基与风格资金坐标","宽基与风格放在同一标尺，定位大小盘与红利/成长的配置切换")}${chart(sectors,"行业板块资金坐标","行业观察组互斥归类，避免同一ETF在多个板块重复计数")}</section>

      <section class="lower-grid"><article class="panel"><div class="section-head"><div><span>FLOW LEADERS</span><h2>当日流入 / 流出领跑</h2><p>点击任何行查看组内产品与信号质量</p></div><div class="tabs" data-rank-tabs><button class="active" data-period="1d">1日</button><button data-period="5d">5日</button><button data-period="20d">20日</button></div></div><div id="ranking">${ranking(data.groups,"1d",10)}</div></article><article class="panel"><div class="section-head"><div><span>PRICE × FLOW STATE</span><h2>价格—资金状态</h2><p>把“涨跌”与“申赎”分开，避免错误归因</p></div></div><div class="state-grid">${["上涨增配","逆势承接","上涨减配","下跌流出"].map(state=>{const rs=data.groups.filter(r=>r.priceFlowState===state).sort((a,b)=>Math.abs(b.flow5d)-Math.abs(a.flow5d));return `<article><span>${state}</span><b>${rs.slice(0,3).map(r=>r.name).join(" · ")||"暂无"}</b><small>${state==="上涨增配"?"价格与资金同向走强":state==="逆势承接"?"价格弱、份额增，观察是否止跌":state==="上涨减配"?"价格强、资金出，关注兑现":"价格与资金同向走弱"}</small></article>`}).join("")}</div></article></section>

      <section id="detail" class="panel"><div class="section-head"><div><span>OBJECTIVE EVIDENCE TABLE</span><h2>全部观察组证据表</h2><p>同时展示1/5/20日资金变化、相对收益、ETF增减只数与集中度</p></div><div class="filters"><button class="active" data-kind="all">全部</button><button data-kind="broad">宽基</button><button data-kind="style">风格</button><button data-kind="sector">行业</button></div></div><div class="evidence-table"><div class="e-row e-head"><span>观察组</span><span>1日</span><span>5日</span><span>20日</span><span>5日资金变化率</span><span>20日相对收益</span><span>5日ETF分布</span><span>状态 / 集中度</span></div><div id="evidence-rows">${evidenceRows(data.groups)}</div></div></section>

      <section class="qa-grid"><article class="panel"><div class="section-head"><div><span>DATA QUALITY</span><h2>数据质量与更新状态</h2></div><b class="verified">✓ ${data.status.toUpperCase()}</b></div><div class="qa-stats"><span><b>${data.quality.marketEtfCount}</b>交易所ETF总数</span><span><b>${data.quality.classifiedEtfCount}</b>股票ETF观察池</span><span><b>${(data.quality.returnProxyCoverage*100).toFixed(0)}%</b>收益代理覆盖</span><span><b>${data.quality.officialSessions}</b>官方份额交易日</span></div><p>${data.quality.issues.length?data.quality.issues.map(x=>esc(x.message)).join("；"):"全量、日期、历史窗口、收益代理检查均通过。"}</p></article><article class="panel methodology"><div class="section-head"><div><span>METHODOLOGY</span><h2>指标口径</h2></div></div><dl><dt>资金估算</dt><dd>${esc(data.methodology.flow)}</dd><dt>坐标轴</dt><dd>${esc(data.methodology.coordinates)}</dd><dt>收益代理</dt><dd>${esc(data.methodology.return)}</dd><dt>统计范围</dt><dd>${esc(data.methodology.scope)}</dd></dl></article></section>

      <footer class="disclaimer"><b>资金ETF流动每日跟踪</b><p>数据来源：上海证券交易所、深圳证券交易所、东方财富、新浪公开行情；AKShare为固定版本采集适配层。网站在交易日20:30、23:00和次日09:15自动检查，优先发布交易所最新完整日终份额；未发布时保留上一份已验证快照。本页不使用模拟数据，不构成投资建议。</p><span>${data.tradeDate}</span></footer>
    </main><div id="drawer"></div>`;
    bind(data);
  }

  function evidenceRows(rows){return rows.map(r=>`<button class="e-row" data-id="${r.id}" data-kind-row="${r.kind}"><span><b>${r.name}</b><small>${kindName[r.kind]} · ${r.etfCount}只 · 估算规模 ${r.aum.toFixed(0)}亿</small></span><strong class="${tone(r.flow1d)}">${money(r.flow1d)}</strong><strong class="${tone(r.flow5d)}">${money(r.flow5d)}</strong><strong class="${tone(r.flow20d)}">${money(r.flow20d)}</strong><span class="${tone(flowRate(r))}">${pct(flowRate(r))}</span><span class="${tone(r.relativeReturn20d)}">${pct(r.relativeReturn20d)}</span><span>${countText(r,"5d")}</span><span><b>${r.priceFlowState}</b><small>单只贡献 ${r.concentration1d.toFixed(0)}%</small></span></button>`).join("")}

  function bind(data){
    document.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>openDrawer(data,el.dataset.id));
    document.querySelectorAll("[data-rank-tabs] button").forEach(button=>button.onclick=()=>{document.querySelectorAll("[data-rank-tabs] button").forEach(x=>x.classList.remove("active"));button.classList.add("active");$("#ranking").innerHTML=ranking(data.groups,button.dataset.period,10);$("#ranking").querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>openDrawer(data,el.dataset.id))});
    document.querySelectorAll("[data-kind]").forEach(button=>button.onclick=()=>{document.querySelectorAll("[data-kind]").forEach(x=>x.classList.remove("active"));button.classList.add("active");document.querySelectorAll("[data-kind-row]").forEach(row=>row.hidden=button.dataset.kind!=="all"&&row.dataset.kindRow!==button.dataset.kind)});
    $("#export").onclick=()=>exportJpg(data.tradeDate);
  }

  function openDrawer(data,id){const r=data.groups.find(x=>x.id===id),etfs=data.etfs.filter(x=>x.groupId===id).slice(0,10);$("#drawer").innerHTML=`<div class="drawer-bg"><button class="drawer-mask" aria-label="关闭"></button><aside class="drawer"><button class="drawer-close">×</button><span>${kindName[r.kind]} OBSERVATION GROUP</span><h2>${r.name}</h2><div class="drawer-kpis"><article><span>1日资金变化</span><b class="${tone(r.flow1d)}">${money(r.flow1d)}</b></article><article><span>5日累计</span><b class="${tone(r.flow5d)}">${money(r.flow5d)}</b></article><article><span>20日累计</span><b class="${tone(r.flow20d)}">${money(r.flow20d)}</b></article><article><span>20日相对收益</span><b class="${tone(r.relativeReturn20d)}">${pct(r.relativeReturn20d)}</b></article></div><div class="drawer-answer"><b>${r.priceFlowState}</b><p>5日资金变化率 ${pct(flowRate(r))}，ETF份额 ${countText(r,"5d")}；当日最大单只产品贡献 ${r.concentration1d.toFixed(1)}%。${r.concentration1d>70?"变化主要来自少数产品，板块代表性较弱。":"变化未明显集中于单只产品。"}</p></div><h3>组内主要ETF（按当日绝对变化排序）</h3><div class="etf-table">${etfs.map(e=>`<div><span><b>${e.name}</b><small>${e.code} · ${e.referencePriceType}</small></span><span>${e.aum.toFixed(1)}亿</span><strong class="${tone(e.flow1d)}">${money(e.flow1d)}</strong></div>`).join("")}</div><p class="drawer-note">该组由名称规则互斥归类；收益代理为 ${r.representative.name}（${r.representative.code}）。</p></aside></div>`;$(".drawer-mask").onclick=$(".drawer-close").onclick=()=>$("#drawer").innerHTML=""}

  async function exportJpg(day){const report=$("#report"),button=$("#export"),desktop=innerWidth>680;button.disabled=true;button.textContent="正在生成…";if(desktop)report.classList.add("exporting");try{if(!window.__imageExportReady||!window.htmlToImage)throw new Error("图片组件尚未加载，请刷新页面后重试");await document.fonts.ready;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const width=desktop?1440:report.scrollWidth,pixelRatio=desktop?2:2.25;const canvas=await window.htmlToImage.toCanvas(report,{pixelRatio,backgroundColor:"#f2f3f5",cacheBust:true,width,filter:el=>!(el instanceof HTMLElement&&el.dataset.exportHide==="true")});canvas.toBlob(blob=>{if(!blob)return;const objectUrl=URL.createObjectURL(blob),link=document.createElement("a");link.href=objectUrl;link.download=`资金ETF流动每日跟踪_${day}_高清版.jpg`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),5000)},"image/jpeg",.96)}catch(error){alert(`导出失败：${error.message}`)}finally{report.classList.remove("exporting");button.disabled=false;button.textContent="导出高清 JPG"}}
  load();
  </script>
</body>
</html>
