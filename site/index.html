<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="基于沪深交易所ETF日终份额与同日单位净值的A股股票ETF一级市场净申购/赎回金额估算。">
  <title>资金ETF流动每日跟踪</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><main class="loading"><b>VERIFIED DATA</b><h1>正在读取统一口径快照…</h1></main></div>
  <script src="html-to-image.js" onload="window.__imageExportReady=true"></script>
  <script>
  const $=s=>document.querySelector(s), esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
  const money=n=>n==null?"—":`${n>0?"+":n<0?"−":""}${Math.abs(n).toFixed(1)}亿`;
  const pct=n=>n==null?"—":`${n>0?"+":""}${Number(n).toFixed(2)}%`;
  const tone=n=>n>0?"up":n<0?"down":"flat";
  const endpointRate=r=>r.flowIntensity5dEndpointPct??r.flowIntensity5dPct??(r.flowIntensity5dBps==null?null:r.flowIntensity5dBps/100);
  const countText=r=>`${r.increaseEtfCount1d??"—"}只份额增加 / ${r.decreaseEtfCount1d??"—"}只份额减少 / ${r.unchangedEtfCount1d??"—"}只不变`;
  const endpointCountText=r=>`${r.increaseEtfCount5d??"—"}只增加 / ${r.decreaseEtfCount5d??"—"}只减少 / ${r.unchangedEtfCount5d??"—"}只不变`;
  const kindName={broad:"宽基研究组",style:"风格研究组",industry:"行业/主题研究组"};
  const groupTag=r=>r.parent?"主题研究组":kindName[r.kind]||"研究组";
  const periodKey={"1d":"flow1d","5d":"flow5d","20d":"flow20d"};
  const periodLabel={"1d":"当日","5d":"5日逐日累计","20d":"20日逐日累计"};
  const fullDate=d=>new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(new Date(`${d}T12:00:00+08:00`));
  const opinionDate=d=>new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"long",day:"numeric"}).format(new Date(`${d}T12:00:00+08:00`));
  const cumulativeText=(r,h)=>r[`flow${h}dCumulativeStatus`]==="available"?money(r[`flow${h}d`]):"数据积累中";
  const primaryWord=n=>n>0?"净申购":n<0?"净赎回":"净申购/赎回持平";
  const stateText=r=>{const x=r.relativeReturn20d,y=endpointRate(r);if(x==null||y==null)return"数据待补";if(x>=0&&y>=0)return"跑赢基准 · 份额增加";if(x<0&&y>=0)return"跑输基准 · 份额增加";if(x>=0&&y<0)return"跑赢基准 · 份额减少";return"跑输基准 · 份额减少"};

  async function load(){
    try{
      const response=await fetch(`data/latest.json?v=${Date.now()}`,{cache:"no-store"});
      if(!response.ok)throw new Error(`HTTP ${response.status}`);
      const data=await response.json();
      if(data.sourceMode!=="REAL"||data.status==="failed")throw new Error("数据快照未通过发布检查");
      if(data.dataContractVersion!=="7.0")throw new Error("当前快照仍为旧口径，系统已阻止展示，等待统一口径数据重新发布");
      render(data);
    }catch(error){document.getElementById("app").innerHTML=`<main class="loading error"><b>DATA BLOCKED</b><h1>当前数据暂不展示</h1><p>${esc(error.message)}</p><small>系统宁可保留空白，也不会用旧口径、模拟数据或未通过审计的数据补位。</small></main>`}
  }

  function chart(rows,title,subtitle){
    const usable=rows.filter(r=>r.relativeReturn20d!=null&&endpointRate(r)!=null);
    if(!usable.length)return `<article class="panel chart-card"><div class="section-head"><div><span>PRICE PROXY × ENDPOINT SHARE CHANGE</span><h2>${title}</h2><p>${subtitle}</p></div></div><div class="loading"><p>当前没有足够的价格代理与端点份额数据。</p></div></article>`;
    const xMax=Math.max(2,...usable.map(r=>Math.abs(r.relativeReturn20d)))*1.16;
    const yMax=Math.max(.5,...usable.map(r=>Math.abs(endpointRate(r))))*1.16;
    const plotted=[...usable].sort((a,b)=>(b.aum||0)-(a.aum||0));
    return `<article class="panel chart-card"><div class="section-head"><div><span>PRICE PROXY × ENDPOINT SHARE CHANGE</span><h2>${title}</h2><p>${subtitle}</p></div><div class="period-note">代表ETF近20日价格代理 × 5日端点份额变化</div></div>
      <div class="quadrant">
        <div class="quad-label q1"><b>跑赢基准 · 份额增加</b><span>代表ETF相对强，组内5日端点份额增加</span></div><div class="quad-label q2"><b>跑输基准 · 份额增加</b><span>代表ETF相对弱，组内5日端点份额增加</span></div>
        <div class="quad-label q3"><b>跑输基准 · 份额减少</b><span>代表ETF相对弱，组内5日端点份额减少</span></div><div class="quad-label q4"><b>跑赢基准 · 份额减少</b><span>代表ETF相对强，组内5日端点份额减少</span></div>
        <i class="axis axis-x"></i><i class="axis axis-y"></i>
        ${plotted.map(r=>{const rate=endpointRate(r),left=50+r.relativeReturn20d/xMax*45,top=50-rate/yMax*43,priority=Math.log1p(r.aum||0)+Math.abs(r.relativeReturn20d/xMax)*2+Math.abs(rate/yMax)*2;return `<button class="bubble ${tone(rate)}" data-id="${r.id}" data-label-priority="${priority}" style="left:${left}%;top:${top}%" title="${esc(r.name)}｜代表ETF20日相对收益 ${pct(r.relativeReturn20d)}｜5日端点份额变化强度 ${pct(rate)}"><span>${esc(r.name)}</span></button>`}).join("")}
        <span class="axis-title x-title">代表ETF近20日相对沪深300收益 →</span><span class="axis-title y-title">↑ 5日端点份额变化金额估算 / 5日前参考规模</span>
      </div>
      <div class="legend"><span><i class="red"></i>端点份额增加</span><span><i class="green"></i>端点份额减少</span><span class="legend-note">该图不是5日逐日累计资金流</span></div>
    </article>`;
  }

  function layoutBubbleLabels(){
    document.querySelectorAll(".quadrant").forEach(plot=>{
      const bubbles=[...plot.querySelectorAll(".bubble")].sort((a,b)=>Number(b.dataset.labelPriority)-Number(a.dataset.labelPriority)),accepted=[],bounds=plot.getBoundingClientRect(),mobile=bounds.width<500,candidates=[];
      const step=mobile?10:12,maxRadius=mobile?380:320;
      for(let radius=14;radius<=maxRadius;radius+=step){for(let angle=-90;angle<270;angle+=mobile?20:24){const rad=angle*Math.PI/180;candidates.push({x:Math.cos(rad)*radius,y:Math.sin(rad)*radius,d:radius})}}
      candidates.unshift({x:0,y:mobile?13:16,d:0},{x:0,y:mobile?-13:-16,d:0});candidates.sort((a,b)=>a.d-b.d);
      for(const bubble of bubbles){
        const anchor=bubble.getBoundingClientRect();bubble.hidden=false;bubble.style.setProperty("--label-x","0px");bubble.style.setProperty("--label-y","0px");
        const measured=bubble.getBoundingClientRect(),w=measured.width,h=measured.height,cx=anchor.left+anchor.width/2,cy=anchor.top+anchor.height/2;let best=null;
        for(const candidate of candidates){const x=Math.min(bounds.right-w/2-3,Math.max(bounds.left+w/2+3,cx+candidate.x)),y=Math.min(bounds.bottom-h/2-3,Math.max(bounds.top+h/2+3,cy+candidate.y)),rect={left:x-w/2,right:x+w/2,top:y-h/2,bottom:y+h/2};const overlap=accepted.reduce((sum,r)=>sum+Math.max(0,Math.min(rect.right,r.right)-Math.max(rect.left,r.left))*Math.max(0,Math.min(rect.bottom,r.bottom)-Math.max(rect.top,r.top)),0),score=overlap*100+Math.hypot(x-cx,y-cy);if(!best||score<best.score)best={x,y,rect,score};if(overlap===0)break}
        bubble.style.setProperty("--label-x",`${best.x-cx}px`);bubble.style.setProperty("--label-y",`${best.y-cy}px`);accepted.push(best.rect);
      }
    })
  }

  function summaryCard(r){return `<button class="summary-card" data-id="${r.id}"><div><span>${groupTag(r)} · ${r.etfCount}只</span><h3>${esc(r.name)}</h3></div><strong class="${tone(r.flow1d)}">${money(r.flow1d)}</strong><div class="periods"><span><b class="${tone(r.flow1d)}">${money(r.flow1d)}</b><small>1日净申赎估算</small></span><span><b class="${tone(r.flow5d)}">${cumulativeText(r,5)}</b><small>5日逐日累计</small></span><span><b class="${tone(r.flow20d)}">${cumulativeText(r,20)}</b><small>20日逐日累计</small></span></div><footer><span>${stateText(r)}</span><b>${pct(endpointRate(r))}</b></footer></button>`}

  function ranking(rows,period,limit=10){
    const key=periodKey[period],usable=rows.filter(r=>typeof r[key]==="number"&&Number.isFinite(r[key]));
    if(!usable.length)return `<div class="loading"><p>${periodLabel[period]}数据尚未满足完整事实要求。</p></div>`;
    const sorted=[...usable].sort((a,b)=>b[key]-a[key]),selected=[...sorted.slice(0,Math.ceil(limit/2)),...sorted.slice(-Math.floor(limit/2)).reverse()],max=Math.max(...selected.map(r=>Math.abs(r[key])),.1);
    return `<div class="rank-list">${selected.map(r=>`<button data-id="${r.id}"><span><b>${esc(r.name)}</b><small>${groupTag(r)} · ${stateText(r)}</small></span><div class="rankbar"><i class="${tone(r[key])}" style="width:${Math.abs(r[key])/max*100}%"></i></div><strong class="${tone(r[key])}">${money(r[key])}</strong></button>`).join("")}</div>`
  }

  function evidenceRows(rows){return rows.map(r=>`<button class="e-row" data-id="${r.id}" data-kind-row="${r.kind}"><span><b>${esc(r.name)}</b><small>${groupTag(r)} · ${r.etfCount}只</small></span><strong class="${tone(r.flow1d)}">${money(r.flow1d)}</strong><strong class="${tone(r.flow5d)}">${cumulativeText(r,5)}</strong><strong class="${tone(r.flow20d)}">${cumulativeText(r,20)}</strong><span class="${tone(endpointRate(r))}">${pct(endpointRate(r))}</span><span><b>${stateText(r)}</b><small>${endpointCountText(r)}</small></span></button>`).join("")}

  function render(data){
    window.snapshot=data;
    const broad=data.groups.filter(r=>r.kind==="broad"),styles=data.groups.filter(r=>r.kind==="style"),industries=data.groups.filter(r=>r.kind==="industry"),wide=[...broad,...styles];
    const cards=["hs300","csi_a500","csi500","csi1000","chinext","star50"].map(id=>data.groups.find(r=>r.id===id)).filter(Boolean);
    const flowGroups=data.groups.filter(r=>typeof r.flow1d==="number"),topIn=[...flowGroups].sort((a,b)=>b.flow1d-a.flow1d)[0],topOut=[...flowGroups].sort((a,b)=>a.flow1d-b.flow1d)[0];
    document.getElementById("app").innerHTML=`
    <nav><div class="brand-mark">F</div><div class="brand"><b>资金ETF流动每日跟踪</b><span>A-SHARE ETF PRIMARY FLOW MONITOR</span></div><div class="nav-links"><a href="#summary">结论</a><a href="#broad">宽基摘要</a><a href="#maps">资金坐标</a><a href="#detail">明细</a></div><button id="export" data-export-hide="true">导出高清 JPG</button></nav>
    <main id="report" class="report">
      <header class="masthead"><div><span>DAILY CLIENT BRIEF · VERIFIED CLOSE</span><h1>资金ETF流动每日跟踪</h1><p>日终份额 · 同日净值 · 统一口径 · 可追溯</p></div><div class="analysis-date"><span>数据交易日</span><strong>${fullDate(data.tradeDate)}</strong></div></header>

      <section id="summary" class="conclusion panel"><div class="section-head"><div><span>PRIMARY-MARKET CLIENT VIEW</span><h2>${opinionDate(data.tradeDate)} ETF跟踪观点</h2><p>一级市场净申购/赎回金额估算 · 下一交易日盘前使用</p></div><b class="confidence">置信度 ${data.conclusion.confidence}</b></div><h3>${esc(data.conclusion.headline)}</h3><div class="facts">${data.conclusion.facts.map((x,i)=>`<article><b>0${i+1}</b><p>${esc(x)}</p></article>`).join("")}</div><div class="view"><b>数据解读边界</b><p>${esc(data.conclusion.interpretation)}</p></div></section>

      <section class="market-strip"><article><span>A股股票ETF当日一级市场净申赎估算</span><strong class="${tone(data.market.flow1d)}">${money(data.market.flow1d)}</strong><small>${primaryWord(data.market.flow1d)} · ${data.market.etfCount}只</small></article><article><span>5日逐日累计净申赎估算</span><strong class="${tone(data.market.flow5d)}">${cumulativeText(data.market,5)}</strong><small>仅在5个已验证交易日事实齐全时发布</small></article><article><span>20日逐日累计净申赎估算</span><strong class="${tone(data.market.flow20d)}">${cumulativeText(data.market,20)}</strong><small>仅在20个已验证交易日事实齐全时发布</small></article><article class="flow-distribution"><span>当日ETF份额方向分布</span><strong>${countText(data.market)}</strong></article><article><span>研究组最大净申购估算</span><strong class="up">${esc(topIn?.name||"—")}</strong><small>${topIn?money(topIn.flow1d):"—"}</small></article><article><span>研究组最大净赎回估算</span><strong class="down">${esc(topOut?.name||"—")}</strong><small>${topOut?money(topOut.flow1d):"—"}</small></article></section>

      <section id="broad" class="panel"><div class="section-head"><div><span>CORE BROAD RESEARCH GROUPS</span><h2>主要宽基数据摘要</h2><p>1日为一级市场净申购/赎回估算；5日和20日只展示逐日事实求和，事实不足则不显示数值</p></div></div><div class="summary-grid">${cards.map(summaryCard).join("")}</div></section>

      <section id="maps" class="map-grid">${chart(wide,"宽基与风格：代表ETF价格 × 端点份额变化","价格端使用各组代表ETF作为代理；资金端使用组内ETF的5日端点份额变化金额估算")}${chart(industries,"行业/主题研究分组：代表ETF价格 × 端点份额变化","行业和主题为研究分组；歧义名称不进入分组排名，市场总量不受影响")}</section>

      <section class="lower-grid"><article class="panel"><div class="section-head"><div><span>PRIMARY FLOW LEADERS</span><h2 id="flow-leaders-title">当日净申购 / 净赎回估算排名</h2><p>所有排名使用同一一级市场口径；5日/20日只有完整逐日事实时才参与排名</p></div><div class="tabs" data-rank-tabs><button class="active" data-period="1d">1日</button><button data-period="5d">5日累计</button><button data-period="20d">20日累计</button></div></div><div id="ranking">${ranking(data.groups,"1d",10)}</div></article><article class="panel"><div class="section-head"><div><span>PRICE PROXY × ENDPOINT STATE</span><h2>代表ETF相对表现与5日端点份额方向</h2><p>该模块只描述价格代理与端点份额变化的组合状态，不把端点变化称为5日累计资金流</p></div></div><div class="state-grid">${["跑赢基准 · 份额增加","跑输基准 · 份额增加","跑赢基准 · 份额减少","跑输基准 · 份额减少"].map(state=>{const rs=data.groups.filter(r=>stateText(r)===state).sort((a,b)=>Math.abs(endpointRate(b)||0)-Math.abs(endpointRate(a)||0));return `<article><span>${state}</span><b>${rs.slice(0,3).map(r=>esc(r.name)).join(" · ")||"当前暂无符合条件的研究组"}</b><small>以代表ETF近20日相对沪深300收益和5日端点份额变化强度判定</small></article>`}).join("")}</div></article></section>

      <section id="detail" class="panel"><div class="section-head"><div><span>OBJECTIVE EVIDENCE TABLE</span><h2>全部研究组证据表</h2><p>${broad.length}个宽基研究组 + ${styles.length}个风格研究组 + ${industries.length}个行业/主题研究组</p></div><div class="filters"><button class="active" data-kind="all">全部 ${data.groups.length}</button><button data-kind="broad">宽基 ${broad.length}</button><button data-kind="style">风格 ${styles.length}</button><button data-kind="industry">行业/主题 ${industries.length}</button></div></div><div class="classification-callout"><b>研究分组口径</b><span>${esc(data.methodology.classification)}</span></div><div class="evidence-table"><div class="e-row e-head"><span>研究组</span><span>1日净申赎估算</span><span>5日逐日累计</span><span>20日逐日累计</span><span>5日端点强度</span><span>价格代理×端点状态</span></div><div id="evidence-rows">${evidenceRows(data.groups)}</div></div></section>

      ${bottomNotes(data)}
      <footer class="disclaimer"><b>资金ETF流动每日跟踪</b><p>一级市场主数据：上海证券交易所、深圳证券交易所ETF日终份额；估值与资产范围：精确交易日ETF单位净值和基金类型；二级市场成交方向统计单独保存，不与一级市场申赎混用。AKShare仅作为公开数据接口适配层。未通过统一审计的数据不发布。本页不构成投资建议。</p><span>${esc(data.tradeDate)} · Contract ${esc(data.dataContractVersion)}</span></footer>
    </main><div id="drawer"></div>`;
    bind(data);requestAnimationFrame(layoutBubbleLabels)
  }

  function bottomNotes(data){const audit=data.universeAudit||{},added=audit.added||[],missing=audit.missing||[],renamed=audit.renamed||[],quality=data.quality||{};const productList=rows=>rows.length?rows.slice(0,6).map(x=>`${esc(x.name||x.currentName)}（${esc(x.code)}）`).join("、")+(rows.length>6?`等${rows.length}只`:""):"无";return `<section class="qa-grid notes-at-end"><article class="panel"><div class="section-head"><div><span>ETF UNIVERSE CHECK</span><h2>全量ETF每日变更检查</h2></div></div><div class="qa-stats"><span><b>${quality.completeUniverseCount??quality.marketEtfCount}</b>交易所完整ETF</span><span><b>${added.length}</b>当日新增</span><span><b>${missing.length}</b>当日消失</span><span><b>${renamed.length}</b>名称变化</span></div><dl class="audit-list"><dt>新增</dt><dd>${productList(added)}</dd><dt>消失</dt><dd>${productList(missing)}</dd><dt>名称变化</dt><dd>${renamed.length?renamed.slice(0,6).map(x=>`${esc(x.previousName)} → ${esc(x.currentName)}（${esc(x.code)}）`).join("、"):"无"}</dd><dt>分类歧义</dt><dd>${quality.ambiguousClassificationCount??0}只；歧义ETF保留在市场总量，但不进入研究分组结论。</dd></dl></article><article class="panel methodology"><div class="section-head"><div><span>DATA CONTRACT & PROVENANCE</span><h2>数据、口径与溯源</h2></div></div><dl><dt>数据契约</dt><dd>Contract ${esc(data.dataContractVersion)}；所有客户模块共用同一一级市场事实、同一份额方向字段和同一统计范围。</dd><dt>资金口径</dt><dd>${esc(data.methodology.flow)}</dd><dt>份额方向</dt><dd>${esc(data.methodology.direction)}</dd><dt>多日口径</dt><dd>${esc(data.methodology.multiDay)}</dd><dt>分类口径</dt><dd>${esc(data.methodology.classification)}</dd><dt>坐标口径</dt><dd>${esc(data.methodology.coordinates)}</dd><dt>二级市场</dt><dd>${esc(data.methodology.secondary)}</dd><dt>统计范围</dt><dd>${esc(data.methodology.scope)}</dd><dt>估值口径</dt><dd>${esc(data.methodology.valuation)}</dd></dl></article></section>`}

  function bind(data){
    document.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>openDrawer(data,el.dataset.id));
    document.querySelectorAll("[data-rank-tabs] button").forEach(button=>button.onclick=()=>{document.querySelectorAll("[data-rank-tabs] button").forEach(x=>x.classList.remove("active"));button.classList.add("active");$("#flow-leaders-title").textContent=`${periodLabel[button.dataset.period]}净申购 / 净赎回估算排名`;$("#ranking").innerHTML=ranking(data.groups,button.dataset.period,10);$("#ranking").querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>openDrawer(data,el.dataset.id))});
    document.querySelectorAll("[data-kind]").forEach(button=>button.onclick=()=>{document.querySelectorAll("[data-kind]").forEach(x=>x.classList.remove("active"));button.classList.add("active");document.querySelectorAll("[data-kind-row]").forEach(row=>row.hidden=button.dataset.kind!=="all"&&row.dataset.kindRow!==button.dataset.kind)});
    $("#export").onclick=()=>exportJpg(data.tradeDate)
  }

  function openDrawer(data,id){const r=data.groups.find(x=>x.id===id);if(!r)return;const etfs=data.etfs.filter(x=>x.groupId===id);const representative=r.representative||{};$("#drawer").innerHTML=`<div class="drawer-bg"><button class="drawer-mask" aria-label="关闭"></button><aside class="drawer"><button class="drawer-close">×</button><span>${groupTag(r)} · RESEARCH GROUP</span><h2>${esc(r.name)}</h2><div class="drawer-kpis"><article><span>组内ETF参考规模</span><b>${Number(r.aum||0).toFixed(1)}亿</b></article><article><span>纳入分组ETF</span><b>${etfs.length}只</b></article><article><span>当日净申购/赎回估算</span><b class="${tone(r.flow1d)}">${money(r.flow1d)}</b></article><article><span>5日逐日累计</span><b class="${tone(r.flow5d)}">${cumulativeText(r,5)}</b></article><article><span>5日端点变化估算</span><b class="${tone(r.flow5dEndpoint)}">${money(r.flow5dEndpoint)}</b></article><article><span>代表ETF20日相对收益</span><b class="${tone(r.relativeReturn20d)}">${pct(r.relativeReturn20d)}</b></article></div><div class="drawer-answer"><b>${stateText(r)}</b><p>5日端点份额变化强度 ${pct(endpointRate(r))}；${endpointCountText(r)}。该状态使用代表ETF价格代理和端点份额变化，不等同于5日累计资金流。</p></div><h3>组内ETF（按当日绝对净申赎估算排序，共${etfs.length}只）</h3><div class="etf-table">${[...etfs].sort((a,b)=>Math.abs(b.flow1d||0)-Math.abs(a.flow1d||0)).map(e=>`<div><span><b>${esc(e.name)}</b><small>${esc(e.code)} · ${esc(e.classificationMethod||"fund_name_rule")}</small></span><span>${Number(e.aum||0).toFixed(1)}亿</span><strong class="${tone(e.flow1d)}">${money(e.flow1d)}</strong></div>`).join("")}</div><p class="drawer-note">当日主口径 = 公司行动调整后的日终份额变化 × 同日单位净值。研究组分类不代表基金管理人或指数公司官方分类；价格代理为 ${esc(representative.name||"待补")}（${esc(representative.code||"—")}）。</p></aside></div>`;$(".drawer-mask").onclick=$(".drawer-close").onclick=()=>$("#drawer").innerHTML=""}

  async function exportJpg(day){const report=$("#report"),button=$("#export"),desktop=innerWidth>680;button.disabled=true;button.textContent="正在生成…";report.classList.add("export-crop","exporting");try{if(!window.__imageExportReady||!window.htmlToImage)throw new Error("图片组件尚未加载，请刷新页面后重试");await document.fonts.ready;layoutBubbleLabels();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const canvas=await window.htmlToImage.toCanvas(report,{pixelRatio:3,backgroundColor:"#f2f3f5",cacheBust:true,width:900,filter:el=>!(el instanceof HTMLElement&&el.dataset.exportHide==="true")});canvas.toBlob(blob=>{if(!blob)return;const objectUrl=URL.createObjectURL(blob);if(desktop){const link=document.createElement("a");link.href=objectUrl;link.download=`资金ETF流动每日跟踪_${day}_高清版.jpg`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),5000)}else{const wrap=document.createElement("div");wrap.style.cssText="position:fixed;inset:0;z-index:99;background:#111318e6;overflow:auto;padding:18px 10px 30px;text-align:center";const tip=document.createElement("p");tip.textContent="长按下方图片，保存到相册";tip.style.cssText="color:#fff;font-size:13px;margin:0 0 10px";const img=document.createElement("img");img.src=objectUrl;img.style.cssText="width:100%;max-width:680px;display:block;margin:0 auto";wrap.append(tip,img);wrap.onclick=()=>{wrap.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),5000)};document.body.appendChild(wrap)}},"image/jpeg",.97)}catch(error){alert(`导出失败：${error.message}`)}finally{report.classList.remove("exporting","export-crop");requestAnimationFrame(layoutBubbleLabels);button.disabled=false;button.textContent="导出高清 JPG"}}
  addEventListener("resize",()=>requestAnimationFrame(layoutBubbleLabels));
  load();
  </script>
</body>
