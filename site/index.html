<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="基于沪深交易所真实ETF日终份额的A股ETF资金流每日跟踪。">
  <title>资金ETF流动每日跟踪</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><main class="loading"><b>VERIFIED DATA</b><h1>正在读取已验证快照…</h1></main></div>
  <script src="html-to-image.js" onload="window.__imageExportReady=true"></script>
  <script>
  const $=s=>document.querySelector(s), esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
  const headlineHtml=v=>String(v??"").split("\n").map(p=>p.startsWith("—— ")?`<em>${esc(p)}</em>`:esc(p)).join("\n");
  const money=n=>n==null?"—":Math.abs(n)<0.05?"0.0亿":`${n>0?"+":"−"}${Math.abs(n).toFixed(1)}亿`;
  const pct=n=>n==null?"—":`${n>0?"+":""}${n.toFixed(2)}%`;
  const flowRate=r=>r.flowIntensity5dPct??(r.flowIntensity5dBps==null?null:r.flowIntensity5dBps/100);
  const countText=(r,period="1d")=>`${r[`increaseEtfCount${period}`]??"—"}只流入 / ${r[`decreaseEtfCount${period}`]??"—"}只流出`;
  const tone=n=>n>0.05?"up":n<-0.05?"down":"flat";
  const kindName={broad:"宽基",style:"风格",industry:"申万一级行业"};
  const groupTag=r=>r.kind==="industry"&&r.parent?"热门主题":kindName[r.kind];
  const priceTypeName={AVG:"成交均价",NAV:"单位净值",CLOSE:"收盘价"};
  const periodKey={"1d":"flow1d","5d":"flow5d","20d":"flow20d"};
  const fullDate=d=>new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(new Date(`${d}T12:00:00+08:00`));
  const opinionDate=d=>new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"long",day:"numeric"}).format(new Date(`${d}T12:00:00+08:00`));

  async function load(){
    try{
      const response=await fetch(`data/latest.json?v=${Date.now()}`,{cache:"no-store"});
      if(!response.ok)throw new Error(`HTTP ${response.status}`);
      const data=await response.json();
      if(data.schemaVersion<4||data.sourceMode!=="REAL"||data.status==="failed")throw new Error("数据快照未通过发布检查");
      render(data);
    }catch(error){document.getElementById("app").innerHTML=`<main class="loading error"><b>DATA BLOCKED</b><h1>今日数据暂未发布</h1><p>${esc(error.message)}</p><small>系统会保留上一份验证快照，不使用模拟数据补位。</small></main>`}
  }

  function bubbleDiameter(aum,maxAum){return Math.max(11,Math.sqrt(Math.max(aum,0)/Math.max(maxAum,1))*42)}

  function chart(rows,title,subtitle){
    const usable=rows.filter(r=>r.relativeReturn20d!=null&&flowRate(r)!=null);
    const xMax=Math.max(2,...usable.map(r=>Math.abs(r.relativeReturn20d)))*1.16;
    const yMax=Math.max(.5,...usable.map(r=>Math.abs(flowRate(r))))*1.16;
    const aMax=Math.max(...usable.map(r=>r.aum),1),plotted=[...usable].sort((a,b)=>b.aum-a.aum);
    return `<article class="panel chart-card"><div class="section-head"><div><span>PRICE × FLOW MAP</span><h2>${title}</h2><p>${subtitle}</p></div><div class="period-note">近20日价格 × 近5日资金</div></div>
      <div class="quadrant">
        <div class="quad-label q1"><b>跑赢基准 · 资金流入</b><span>20日相对强，5日份额增加</span></div><div class="quad-label q2"><b>跑输基准 · 资金流入</b><span>20日相对弱，5日份额增加</span></div>
        <div class="quad-label q3"><b>跑输基准 · 资金流出</b><span>20日相对弱，5日份额减少</span></div><div class="quad-label q4"><b>跑赢基准 · 资金流出</b><span>20日相对强，5日份额减少</span></div>
        <i class="axis axis-x"></i><i class="axis axis-y"></i>
        ${plotted.map(r=>{const rate=flowRate(r),left=50+r.relativeReturn20d/xMax*45,top=50-rate/yMax*43,priority=Math.log1p(r.aum)+Math.abs(r.relativeReturn20d/xMax)*2+Math.abs(rate/yMax)*2;return `<button class="bubble ${tone(rate)}" data-id="${r.id}" data-label-priority="${priority}" style="left:${left}%;top:${top}%" title="${r.name}｜规模 ${r.aum.toFixed(1)}亿｜20日相对收益 ${pct(r.relativeReturn20d)}｜5日资金变化率 ${pct(rate)}"><span>${r.name}</span></button>`}).join("")}
        <span class="axis-title x-title">20日相对沪深300收益 →</span><span class="axis-title y-title">↑ 5日资金变化率（占5日前规模）</span>
      </div>
      <div class="legend"><span><i class="red"></i>5日净流入</span><span><i class="green"></i>5日净流出</span><span class="legend-note">全部标签就近避让，点击气泡查看明细</span></div>
    </article>`;
  }

  function layoutBubbleLabels(){
    document.querySelectorAll(".quadrant").forEach(plot=>{
      const bubbles=[...plot.querySelectorAll(".bubble")].sort((a,b)=>Number(b.dataset.labelPriority)-Number(a.dataset.labelPriority)),accepted=[],bounds=plot.getBoundingClientRect(),mobile=bounds.width<500,candidates=[];
      const step=mobile?10:12,maxRadius=mobile?380:320;
      for(let radius=14;radius<=maxRadius;radius+=step){for(let angle=-90;angle<270;angle+=mobile?20:24){const rad=angle*Math.PI/180;candidates.push({x:Math.cos(rad)*radius,y:Math.sin(rad)*radius,d:radius})}}
      candidates.unshift({x:0,y:mobile?13:16,d:0},{x:0,y:mobile?-13:-16,d:0});
      candidates.sort((a,b)=>a.d-b.d);
      for(const bubble of bubbles){
        const label=bubble,anchor=bubble.getBoundingClientRect();
        label.hidden=false;label.style.setProperty("--label-x","0px");label.style.setProperty("--label-y","0px");
        const measured=label.getBoundingClientRect(),w=measured.width,h=measured.height,cx=anchor.left+anchor.width/2,cy=anchor.top+anchor.height/2;
        let best=null;
        for(const candidate of candidates){
          const x=Math.min(bounds.right-w/2-3,Math.max(bounds.left+w/2+3,cx+candidate.x)),y=Math.min(bounds.bottom-h/2-3,Math.max(bounds.top+h/2+3,cy+candidate.y)),rect={left:x-w/2,right:x+w/2,top:y-h/2,bottom:y+h/2};
          const overlap=accepted.reduce((sum,r)=>sum+Math.max(0,Math.min(rect.right,r.right)-Math.max(rect.left,r.left))*Math.max(0,Math.min(rect.bottom,r.bottom)-Math.max(rect.top,r.top)),0),score=overlap*100+Math.hypot(x-cx,y-cy);
          if(!best||score<best.score)best={x,y,rect,score};
          if(overlap===0)break;
        }
        const dx=best.x-cx,dy=best.y-cy;
        label.style.setProperty("--label-x",`${dx}px`);label.style.setProperty("--label-y",`${dy}px`);
        accepted.push(best.rect);
      }
    })
  }

  function summaryCard(r){return `<button class="summary-card" data-id="${r.id}"><div><span>${groupTag(r)} · ${r.etfCount}只</span><h3>${r.name}</h3></div><strong class="${tone(r.flow1d)}">${money(r.flow1d)}</strong><div class="periods"><span><b class="${tone(r.flow1d)}">${money(r.flow1d)}</b><small>1日</small></span><span><b class="${tone(r.flow5d)}">${money(r.flow5d)}</b><small>5日</small></span><span><b class="${tone(r.flow20d)}">${money(r.flow20d)}</b><small>20日</small></span></div><footer><span>${r.priceFlowState}</span><b>${pct(flowRate(r))}</b></footer></button>`}

  function ranking(rows,period,limit=6){const key=periodKey[period],half=Math.ceil(limit/2),inRows=[...rows].filter(r=>r[key]>0).sort((a,b)=>b[key]-a[key]).slice(0,half),outRows=[...rows].filter(r=>r[key]<0).sort((a,b)=>a[key]-b[key]).slice(0,limit-half),max=Math.max(...[...inRows,...outRows].map(r=>Math.abs(r[key])),.1),row=r=>`<button data-id="${r.id}"><span><b>${r.name}</b><small>${groupTag(r)} · ${r.priceFlowState}</small></span><div class="rankbar"><i class="${tone(r[key])}" style="width:${Math.abs(r[key])/max*100}%"></i></div><strong class="${tone(r[key])}">${money(r[key])}</strong></button>`,empty=t=>`<button disabled style="cursor:default;opacity:.6"><span><b>${t}</b><small>全部观察组方向一致</small></span><div class="rankbar"></div><strong>—</strong></button>`;return `<div class="rank-list">${inRows.map(row).join("")}${inRows.length?"":empty("当日无净流入组")}${outRows.map(row).join("")}${outRows.length?"":empty("当日无净流出组")}</div>`}

  function render(data){
    window.snapshot=data;
    const broad=data.groups.filter(r=>r.kind==="broad"), styles=data.groups.filter(r=>r.kind==="style"), industries=data.groups.filter(r=>r.kind==="industry"), wide=[...broad,...styles],industryEtfs=industries.reduce((n,r)=>n+r.etfCount,0),industryParentCount=new Set(industries.map(r=>r.parent||r.id)).size;
    const cards=["hs300","csi_a500","csi500","csi1000","chinext","star50"].map(id=>data.groups.find(r=>r.id===id)).filter(Boolean);
    const topIn=[...data.groups].sort((a,b)=>b.flow1d-a.flow1d)[0],topOut=[...data.groups].sort((a,b)=>a.flow1d-b.flow1d)[0];
    document.getElementById("app").innerHTML=`
    <nav><div class="brand-mark">F</div><div class="brand"><b>资金ETF流动每日跟踪</b><span>A-SHARE ETF FLOW MONITOR</span></div><div class="nav-links"><a href="#summary">结论</a><a href="#broad">宽基摘要</a><a href="#maps">资金坐标</a><a href="#detail">明细</a></div><button id="export" data-export-hide="true">导出高清 JPG</button></nav>
    <main id="report" class="report">
      <header class="masthead"><div><span>DAILY CLIENT BRIEF · OFFICIAL CLOSE</span><h1>资金ETF流动每日跟踪</h1><p>⭐光大证券上海销售团队</p></div><div class="analysis-date"><span>数据交易日</span><strong>${fullDate(data.tradeDate)}</strong></div></header>

      <section id="summary" class="conclusion panel"><div class="section-head"><div><span>PRE-MARKET CLIENT VIEW</span><h2>${opinionDate(data.tradeDate)} ETF跟踪观点</h2><p>${opinionDate(data.tradeDate)}收盘数据 · 下一交易日盘前使用</p></div><b class="confidence">置信度 ${data.conclusion.confidence}</b></div><h3>${headlineHtml(data.conclusion.headline)}</h3><div class="facts">${data.conclusion.facts.map((x,i)=>`<article><b>0${i+1}</b><p>${esc(x)}</p></article>`).join("")}</div><div class="view"><b>数据解读</b><p>${esc(data.conclusion.interpretation)}</p></div></section>

      <section class="market-strip"><article><span>A股股票ETF当日资金变化</span><strong class="${tone(data.market.flow1d)}">${money(data.market.flow1d)}</strong><small>本期统计${data.market.etfCount}只</small></article><article><span>5日累计资金变化</span><strong class="${tone(data.market.flow5d)}">${money(data.market.flow5d)}</strong><small>观察是否连续</small></article><article><span>20日累计资金变化</span><strong class="${tone(data.market.flow20d)}">${money(data.market.flow20d)}</strong><small>观察中期方向</small></article><article class="flow-distribution"><span>当日ETF流入流出分布</span><strong>${countText(data.market)}</strong></article><article><span>最大流入组</span>${topIn.flow1d>0?`<strong class="up">${topIn.name}</strong><small>${money(topIn.flow1d)}</small>`:`<strong>—</strong><small>当日无净流入组</small>`}</article><article><span>最大流出组</span>${topOut.flow1d<0?`<strong class="down">${topOut.name}</strong><small>${money(topOut.flow1d)}</small>`:`<strong>—</strong><small>当日无净流出组</small>`}</article></section>

      <section id="broad" class="panel"><div class="section-head"><div><span>CORE BROAD INDEXES</span><h2>主要宽基数据摘要</h2><p>先看今天，再用5日和20日辨别一次性申赎还是持续切换</p></div></div><div class="summary-grid">${cards.map(summaryCard).join("")}</div></section>

      <section id="maps" class="map-grid">${chart(wide,"宽基与风格资金坐标","宽基与风格放在同一标尺，定位大小盘与红利/成长的配置切换")}${chart(industries,"申万一级与主流行业资金坐标",`申万行业分类标准2021版；31个一级行业中，本期${industryParentCount}个行业存在可分析ETF，共${industryEtfs}只`)}</section>

      <section class="lower-grid"><article class="panel"><div class="section-head"><div><span>FLOW LEADERS</span><h2 id="flow-leaders-title">当日流入领跑 / 流出领跑</h2><p>前半部分为净流入最多的组，后半部分为净流出最多的组</p></div><div class="tabs" data-rank-tabs><button class="active" data-period="1d">1日</button><button data-period="5d">5日</button><button data-period="20d">20日</button></div></div><div id="ranking">${ranking(data.groups,"1d",10)}</div></article><article class="panel"><div class="section-head"><div><span>PRICE × FLOW STATE</span><h2>近20日相对表现与近5日资金方向</h2><p>价格为代表ETF近20日相对沪深300表现，资金为组内ETF近5日净流入/流出；与上方坐标图使用同一口径</p></div></div><div class="state-grid">${["跑赢且流入","跑输但流入","跑赢但流出","跑输且流出"].map(state=>{const rs=data.groups.filter(r=>r.priceFlowState===state).sort((a,b)=>Math.abs(b.flow5d)-Math.abs(a.flow5d));const empty=`当前暂无“${state}”的观察组`;return `<article><span>${state}</span><b>${rs.slice(0,3).map(r=>r.name).join(" · ")||empty}</b><small>${state==="跑赢且流入"?"近20日跑赢沪深300，近5日资金流入":state==="跑输但流入"?"近20日跑输沪深300，但近5日资金流入":state==="跑赢但流出"?"近20日跑赢沪深300，但近5日资金流出":"近20日跑输沪深300，近5日资金流出"}</small></article>`}).join("")}</div></article></section>

      <section id="detail" class="panel"><div class="section-head"><div><span>OBJECTIVE EVIDENCE TABLE</span><h2>全部资金观察组证据表</h2><p>${broad.length}个宽基组 + ${styles.length}个风格策略组 + ${industries.filter(r=>!r.parent).length}个申万一级行业组 + ${industries.filter(r=>r.parent).length}个热门主题组</p></div><div class="filters"><button class="active" data-kind="all">全部 ${data.groups.length}</button><button data-kind="broad">宽基 ${broad.length}</button><button data-kind="style">风格 ${styles.length}</button><button data-kind="industry">行业与主题 ${industries.length}</button></div></div><div class="classification-callout"><b>申万行业口径</b><span>采用申万行业分类标准2021版${data.quality.industryDefinitionCount??31}个一级行业名称与代码；每只ETF按主要暴露行业归入唯一观察组，不重复计数；本期${industryParentCount}个行业存在可分析ETF，${data.quality.industryEtfCount??industryEtfs}只进入分析。</span></div><div class="evidence-table"><div class="e-row e-head"><span>观察组</span><span>1日</span><span>5日</span><span>20日</span><span>5日变化率</span><span>状态</span></div><div id="evidence-rows">${evidenceRows(data.groups)}</div></div></section>

      ${bottomNotes(data)}

      <footer class="disclaimer"><b>资金ETF流动每日跟踪</b><p>数据来源：上海证券交易所、深圳证券交易所、东方财富、新浪公开行情；AKShare为固定版本采集适配层。系统在北京时间0:15、0:30、1:00、5:00、6:00、7:00和8:00检查上一交易日完整日终份额；拿到新交易日数据才更新，未发布时保留上一份已验证快照。本页不使用模拟数据，不构成投资建议。</p><span>${data.tradeDate}观点</span></footer>
    </main><div id="drawer"></div>`;
    bind(data);
  }

  function evidenceRows(rows){return rows.map(r=>`<button class="e-row" data-id="${r.id}" data-kind-row="${r.kind}"><span><b>${r.name}</b><small>${groupTag(r)} · ${r.etfCount}只</small></span><strong class="${tone(r.flow1d)}">${money(r.flow1d)}</strong><strong class="${tone(r.flow5d)}">${money(r.flow5d)}</strong><strong class="${tone(r.flow20d)}">${money(r.flow20d)}</strong><span class="${tone(flowRate(r))}">${pct(flowRate(r))}</span><span><b>${r.priceFlowState}</b><small>${countText(r,"5d")}</small></span></button>`).join("")}

  function bottomNotes(data){const audit=data.universeAudit||{},added=audit.added||[],missing=audit.missing||[],renamed=audit.renamed||[];const productList=rows=>rows.length?rows.slice(0,6).map(x=>`${esc(x.name||x.currentName)}（${esc(x.code)}）`).join("、")+(rows.length>6?`等${rows.length}只`:""):"无";return `<section class="qa-grid notes-at-end"><article class="panel"><div class="section-head"><div><span>ETF UNIVERSE CHECK</span><h2>全量ETF每日变更检查</h2></div></div><div class="qa-stats"><span><b>${data.quality.completeUniverseCount??data.quality.marketEtfCount}</b>交易所完整ETF</span><span><b>${added.length}</b>当日新增</span><span><b>${missing.length}</b>当日消失</span><span><b>${renamed.length}</b>名称变化</span></div><dl class="audit-list"><dt>新增</dt><dd>${productList(added)}</dd><dt>消失</dt><dd>${productList(missing)}</dd><dt>名称变化</dt><dd>${renamed.length?renamed.slice(0,6).map(x=>`${esc(x.previousName)} → ${esc(x.currentName)}（${esc(x.code)}）`).join("、"):"无"}</dd></dl></article><article class="panel methodology"><div class="section-head"><div><span>DATA & METHODOLOGY</span><h2>数据与指标说明</h2></div></div><dl><dt>更新时间</dt><dd>${data.windowStartDate}—${data.tradeDate}，共${data.quality.officialSessions}个交易日；北京时间0:15、0:30、1:00、5:00、6:00、7:00、8:00自动检查上一交易日完整数据，拿到新交易日数据才更新。</dd><dt>发布检查</dt><dd>${{verified:"通过",warning:"警告",failed:"未通过"}[data.status]??data.status.toUpperCase()}；完整ETF ${data.quality.marketEtfCount}只，进入资金分析 ${data.quality.classifiedEtfCount}只，待归类 ${data.quality.unclassifiedEtfCount??"—"}只（未明确对应申万行业、宽基或风格，不进入资金分析）。</dd><dt>申万行业覆盖</dt><dd>31个一级行业中${data.quality.industryGroupCount??"—"}个存在可分析ETF，共${data.quality.industryEtfCount??"—"}只；每日自动对账。</dd><dt>分类口径</dt><dd>${esc(data.methodology.classification)}</dd><dt>资金口径</dt><dd>${esc(data.methodology.flow)}</dd><dt>收益口径</dt><dd>${esc(data.methodology.return)}</dd><dt>坐标轴</dt><dd>${esc(data.methodology.coordinates)}</dd><dt>统计范围</dt><dd>${esc(data.methodology.scope)}</dd></dl></article></section>`}

  function bind(data){
    document.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>openDrawer(data,el.dataset.id));
    document.querySelectorAll("[data-rank-tabs] button").forEach(button=>button.onclick=()=>{document.querySelectorAll("[data-rank-tabs] button").forEach(x=>x.classList.remove("active"));button.classList.add("active");const label={"1d":"当日","5d":"近5日","20d":"近20日"}[button.dataset.period];$("#flow-leaders-title").textContent=`${label}流入领跑 / 流出领跑`;$("#ranking").innerHTML=ranking(data.groups,button.dataset.period,10);$("#ranking").querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>openDrawer(data,el.dataset.id))});
    document.querySelectorAll("[data-kind]").forEach(button=>button.onclick=()=>{document.querySelectorAll("[data-kind]").forEach(x=>x.classList.remove("active"));button.classList.add("active");document.querySelectorAll("[data-kind-row]").forEach(row=>row.hidden=button.dataset.kind!=="all"&&row.dataset.kindRow!==button.dataset.kind)});
    $("#export").onclick=()=>exportJpg(data.tradeDate);
    requestAnimationFrame(layoutBubbleLabels);
  }

  function openDrawer(data,id){const r=data.groups.find(x=>x.id===id),etfs=data.etfs.filter(x=>x.groupId===id);$("#drawer").innerHTML=`<div class="drawer-bg"><button class="drawer-mask" aria-label="关闭"></button><aside class="drawer"><button class="drawer-close">×</button><span>${groupTag(r)} OBSERVATION GROUP</span><h2>${r.name}</h2><div class="drawer-kpis"><article><span>组内ETF参考规模</span><b>${r.aum.toFixed(1)}亿</b></article><article><span>纳入分析ETF</span><b>${etfs.length}只</b></article><article><span>1日资金变化</span><b class="${tone(r.flow1d)}">${money(r.flow1d)}</b></article><article><span>5日累计</span><b class="${tone(r.flow5d)}">${money(r.flow5d)}</b></article><article><span>20日相对收益</span><b class="${tone(r.relativeReturn20d)}">${pct(r.relativeReturn20d)}</b></article></div><div class="drawer-answer"><b>${r.priceFlowState}</b><p>5日资金变化率 ${pct(flowRate(r))}，ETF份额 ${countText(r,"5d")}；当日最大单只产品贡献 ${r.concentration1d.toFixed(1)}%。${r.concentration1d>70?"变化主要来自少数产品，板块代表性较弱。":"变化未明显集中于单只产品。"}</p></div><h3>组内全部ETF（按当日绝对变化排序，共${etfs.length}只）</h3><div class="etf-table">${etfs.map(e=>`<div><span><b>${e.name}</b><small>${e.code} · ${priceTypeName[e.referencePriceType]||e.referencePriceType}</small></span><span>${e.aum.toFixed(1)}亿</span><strong class="${tone(e.flow1d)}">${money(e.flow1d)}</strong></div>`).join("")}</div><p class="drawer-note">参考规模 = 日终总份额 × 当日成交均价（成交额÷成交量），资金变化 = 份额变化 × 当日成交均价；成交均价缺失时依次回退当日收盘价、单位净值。${r.parent?"该组为申万一级行业下的热门主题子组，归属相应一级行业":"该组按ETF名称映射到申万一级行业"}；收益代理为 ${r.representative.name}（${r.representative.code}）。</p></aside></div>`;$(".drawer-mask").onclick=$(".drawer-close").onclick=()=>$("#drawer").innerHTML=""}

  async function exportJpg(day){const report=$("#report"),button=$("#export"),viewport=document.querySelector('meta[name="viewport"]'),savedViewport=viewport.getAttribute("content"),desktop=innerWidth>680;button.disabled=true;button.textContent="正在生成…";viewport.setAttribute("content","width=900");report.classList.add("export-crop");report.classList.add("exporting");try{if(!window.__imageExportReady||!window.htmlToImage)throw new Error("图片组件尚未加载，请刷新页面后重试");await document.fonts.ready;layoutBubbleLabels();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const height=report.scrollHeight,isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1),areaBudget=isIOS?14e6:55e6,ratio=Math.max(1.5,Math.min(3,Math.floor(Math.min(Math.sqrt(areaBudget/(900*height)),15800/height)*10)/10));const canvas=await window.htmlToImage.toCanvas(report,{pixelRatio:ratio,backgroundColor:"#f2f3f5",cacheBust:true,width:900,filter:el=>!(el instanceof HTMLElement&&el.dataset.exportHide==="true")});canvas.toBlob(blob=>{if(!blob){alert("图片生成失败，请刷新页面后重试");return}const objectUrl=URL.createObjectURL(blob),file=new File([blob],`资金ETF流动每日跟踪_${day}_高清版.jpg`,{type:"image/jpeg"});showExportResult(objectUrl,file,desktop)},"image/jpeg",.97)}catch(error){alert(`导出失败：${error.message}`)}finally{viewport.setAttribute("content",savedViewport);report.classList.remove("exporting");report.classList.remove("export-crop");requestAnimationFrame(layoutBubbleLabels);button.disabled=false;button.textContent="导出高清 JPG"}}

  function showExportResult(objectUrl,file,desktop){const wrap=document.createElement("div");wrap.style.cssText="position:fixed;inset:0;z-index:99;background:#111318e6;overflow:auto;padding:18px 12px 34px;text-align:center";const close=document.createElement("button");close.textContent="×";close.style.cssText="position:fixed;top:10px;right:14px;z-index:2;background:#fff;color:#17191e;border:0;width:34px;height:34px;border-radius:50%;font-size:19px;cursor:pointer";const tip=document.createElement("p");tip.style.cssText="color:#fff;font-size:14px;margin:4px 0 12px";const canShare=typeof navigator.canShare==="function"&&navigator.canShare({files:[file]});const btn=document.createElement("button");btn.style.cssText="background:#a62a3c;color:#fff;border:0;padding:12px 30px;font-size:14px;border-radius:3px;cursor:pointer;margin-bottom:13px";const img=document.createElement("img");img.src=objectUrl;img.style.cssText="width:100%;max-width:680px;display:block;margin:0 auto";const note=document.createElement("p");note.style.cssText="color:#b9bec6;font-size:11px;margin:10px 0 0";if(canShare){tip.textContent="高清图已生成";btn.textContent="发送给朋友 / 保存到相册";btn.onclick=()=>navigator.share({files:[file],title:"资金ETF流动每日跟踪"}).catch(()=>{});note.textContent="按钮无反应时，也可长按下方图片保存"}else if(desktop){tip.textContent="高清图已生成";btn.textContent="下载高清 JPG";btn.onclick=()=>{const link=document.createElement("a");link.href=objectUrl;link.download=file.name;document.body.appendChild(link);link.click();link.remove()}}else{tip.textContent="长按下方图片，保存到相册";btn.style.display="none"}wrap.append(close,tip,btn,img,note);close.onclick=()=>{wrap.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),5000)};document.body.appendChild(wrap)}
  addEventListener("resize",()=>requestAnimationFrame(layoutBubbleLabels));
  load();
  </script>
