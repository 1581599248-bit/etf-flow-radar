<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>资金ETF流动逐日跟踪</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><main class="loading"><b>VERIFIED DATA</b><h1>正在读取已验证快照…</h1></main></div>
  <script src="html-to-image.js" onload="window.__imageExportReady=true"></script>
  <script>
  const $=s=>document.querySelector(s), esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
  const headlineHtml=v=>String(v??"").split("\n").map(p=>p.startsWith("—— ")?`<em>${esc(p)}</em>`:esc(p)).join("\n");
  const visibleHeadline=data=>{
    const headline=String(data?.conclusion?.headline??"");
    const firstLine=headline.split("\n",1)[0];
    if (!firstLine.includes("盘中买卖力量基本均衡") || /主动(?:买入|卖出|买卖)净额/.test(firstLine)) return headline;
    const net=data?.flowMetrics?.secondaryMarketTradeFlow?.scopeTotals?.aShareStockEtf?.netFlow1d;
    if (typeof net!=="number" || !Number.isFinite(net)) return headline;
    const amount=net>0?`主动买入净额${net.toFixed(1)}亿元`:net<0?`主动卖出净额${Math.abs(net).toFixed(1)}亿元`:"主动买卖净额0.0亿元";
    return headline.replace("A股ETF盘中买卖力量基本均衡",`A股ETF盘中买卖力量基本均衡，${amount}`);
  };
  const money=n=>n==null?"—":Math.abs(n)<0.05?"0.0亿":`${n>0?"+":"−"}${Math.abs(n).toFixed(1)}亿`;
  const pct=n=>n==null?"—":`${n>0?"+":""}${n.toFixed(2)}%`;
  const flowRate=r=>r.flowIntensity5dPct??(r.flowIntensity5dBps==null?null:r.flowIntensity5dBps/100);
  const countText=(r,period="1d")=>`${r[`increaseEtfCount${period}`]??"—"}只流入 / ${r[`decreaseEtfCount${period}`]??"—"}只流出`;
  const tone=n=>n>0.05?"up":n<-0.05?"down":"flat";
  const kindName={broad:"宽基",style:"风格",industry:"申万一级行业",other:"其他A股"};
  const groupTag=r=>r.kind==="industry"&&r.parent?"热门主题":kindName[r.kind];
  const priceTypeName={AVG:"成交均价",NAV:"单位净值",CLOSE:"收盘价"};
  const periodKey={"1d":"flow1d","5d":"flow5d","20d":"flow20d"};
  const fullDate=d=>new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"short",timeZone:"Asia/Shanghai"}).format(new Date(`${d}T12:00:00+08:00`));
  const opinionDate=d=>new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"long",day:"numeric",timeZone:"Asia/Shanghai"}).format(new Date(`${d}T12:00:00+08:00`));

  async function load(){
    try{
      const response=await fetch(`data/latest.json?v=${Date.now()}`,{cache:"no-store"});
      if(!response.ok)throw new Error(`HTTP ${response.status}`);
      const data=await response.json();
      if(data.schemaVersion<4||data.sourceMode!=="REAL"||data.status!=="verified")throw new Error("数据快照未通过发布检查");
      render(data);
    }catch(error){document.getElementById("app").innerHTML=`<main class="loading error"><b>DATA BLOCKED</b><h1>今日数据暂未发布</h1><p>${esc(error.message)}</p><small>系统会保留上一份验证快照，不使用模拟数据补位。</small></main>`}
  }

  function bubbleDiameter(aum,maxAum){return Math.max(11,Math.sqrt(Math.max(aum,0)/Math.max(maxAum,1))*42)}

  function chart(rows,title,subtitle){
    const usable=rows.filter(r=>r.relativeReturn20d!=null&&flowRate(r)!=null);
    const xMax=Math.max(2,...usable.map(r=>Math.abs(r.relativeReturn20d)))*1.16;
    const yMax=Math.max(.5,...usable.map(r=>Math.abs(flowRate(r))))*1.16;
    const aMax=Math.max(...usable.map(r=>r.aum),1),plotted=[...usable].sort((a,b)=>b.aum-a.aum);
    return `<article class="panel chart-card"><div class="section-head"><div><span>PRICE × FLOW MAP</span><h2>${title}</h2><p>${subtitle}</p></div><div class="period-note">近20日价格 × 近5日资金</div></div>
      <div class="quadrant">
        <div class="quad-label q1"><b>跑赢基准 · 资金流入</b><span>20日相对强，5日份额增加</span></div><div class="quad-label q2"><b>跑输基准 · 资金流入</b><span>20日相对弱，5日份额增加</span></div>
        <div class="quad-label q3"><b>跑输基准 · 资金流出</b><span>20日相对弱，5日份额减少</span></div><div class="quad-label q4"><b>跑赢基准 · 资金流出</b><span>20日相对强，5日份额减少</span></div>
        <i class="axis axis-x"></i><i class="axis axis-y"></i>
        ${plotted.map(r=>{const rate=flowRate(r),left=50+r.relativeReturn20d/xMax*45,top=50-rate/yMax*43,priority=Math.log1p(r.aum)+Math.abs(r.relativeReturn20d/xMax)*2+Math.abs(rate/yMax)*2;return `<button class="bubble ${tone(rate)}" data-id="${r.id}" data-label-priority="${priority}" style="left:${left}%;top:${top}%" title="${r.name}｜规模 ${r.aum.toFixed(1)}亿｜20日相对收益 ${pct(r.relativeReturn20d)}｜5日资金变化率 ${pct(rate)}"><span>${r.name}</span></button>`}).join("")}
        <span class="axis-title x-title">20日相对沪深300收益 →</span><span class="axis-title y-title">↑ 5日资金变化率（占5日前规模）</span>
      </div>
      <div class="legend"><span><i class="red"></i>5日净流入</span><span><i class="green"></i>5日净流出</span><span class="legend-note">全部标签就近避让，点击气泡查看明细</span></div>
    </article>`;
  }

  function layoutBubbleLabels(){
    document.querySelectorAll(".quadrant").forEach(plot=>{
      const bubbles=[...plot.querySelectorAll(".bubble")].sort((a,b)=>Number(b.dataset.labelPriority)-Number(a.dataset.labelPriority)),accepted=[],bounds=plot.getBoundingClientRect(),mobile=bounds.width<500,candidates=[];
      const step=mobile?10:12,maxRadius=mobile?380:320;
      for(let radius=14;radius<=maxRadius;radius+=step){for(let angle=-90;angle<270;angle+=mobile?20:24){const rad=angle*Math.PI/180;candidates.push({x:Math.cos(rad)*radius,y:Math.sin(rad)*radius,d:radius})}}
      candidates.unshift({x:0,y:mobile?13:16,d:0},{x:0,y:mobile?-13:-16,d:0});
      candidates.sort((a,b)=>a.d-b.d);
      for(const bubble of bubbles){
        const label=bubble,anchor=bubble.getBoundingClientRect();
        label.hidden=false;label.style.setProperty("--label-x","0px");label.style.setProperty("--label-y","0px");
        const measured=label.getBoundingClientRect(),w=measured.width,h=measured.height,cx=anchor.left+anchor.width/2,cy=anchor.top+anchor.height/2;
        let best=null;
        for(const candidate of candidates){
          const x=Math.min(bounds.right-w/2-3,Math.max(bounds.left+w/2+3,cx+candidate.x)),y=Math.min(bounds.bottom-h/2-3,Math.max(bounds.top+h/2+3,cy+candidate.y)),rect={left:x-w/2,right:x+w/2,top:y-h/2,bottom:y+h/2};
          const overlap=accepted.reduce((sum,r)=>sum+Math.max(0,Math.min(rect.right,r.right)-Math.max(rect.left,r.left))*Math.max(0,Math.min(rect.bottom,r.bottom)-Math.max(rect.top,r.top)),0),score=overlap*100+Math.hypot(x-cx,y-cy);
          if(!best||score<best.score)best={x,y,rect,score};
          if(overlap===0)break;
        }
        const dx=best.x-cx,dy=best.y-cy;
        label.style.setProperty("--label-x",`${dx}px`);label.style.setProperty("--label-y",`${dy}px`);
        accepted.push(best.rect);
      }
    })
  }

  function summaryCard(r){return `<button class="summary-card" data-id="${r.id}"><div><span>${groupTag(r)} · ${r.etfCount}只</span><h3>${r.name}</h3></div><strong class="${tone(r.flow1d)}">${money(r.flow1d)}</strong><div class="periods"><span><b class="${tone(r.flow1d)}">${money(r.flow1d)}</b><small>1日</small></span><span><b class="${tone(r.flow5d)}">${money(r.flow5d)}</b><small>5日</small></span><span><b class="${tone(r.flow20d)}">${money(r.flow20d)}</b><small>20日</small></span></div><footer><span>${r.priceFlowState}</span><b>${pct(flowRate(r))}</b></footer></button>`}

  function ranking(rows,period,limit=6){const key=periodKey[period],half=Math.ceil(limit/2),inRows=[...rows].filter(r=>r[key]>0).sort((a,b)=>b[key]-a[key]).slice(0,half),outRows=[...rows].filter(r=>r[key]<0).sort((a,b)=>a[key]-b[key]).slice(0,limit-half),max=Math.max(...[...inRows,...outRows].map(r=>Math.abs(r[key])),.1),row=r=>`<button data-id="${r.id}"><span><b>${r.name}</b><small>${groupTag(r)} · ${r.priceFlowState}</small></span><div class="rankbar"><i class="${tone(r[key])}" style="width:${Math.abs(r[key])/max*100}%"></i></div><strong class="${tone(r[key])}">${money(r[key])}</strong></button>`,empty=t=>`<button disabled style="cursor:default;opacity:.6"><span><b>${t}</b><small>全部观察组方向一致</small></span><div class="rankbar"></div><strong>—</strong></button>`;return `<div class="rank-list">${inRows.map(row).join("")}${inRows.length?"":empty("当日无净流入组")}${outRows.map(row).join("")}${outRows.length?"":empty("当日无净流出组")}</div>`}

  function render(data){
    window.snapshot=data;
    const broad=data.groups.filter(r=>r.kind==="broad"), styles=data.groups.filter(r=>r.kind==="style"), industries=data.groups.filter(r=>r.kind==="industry"), otherGroups=data.groups.filter(r=>r.kind==="other"), wide=[...broad,...styles],industryEtfs=industries.reduce((n,r)=>n+r.etfCount,0),industryParentCount=new Set(industries.map(r=>r.parent||r.id)).size;

  function bottomNotes(data){const audit=data.universeAudit||{},added=audit.added||[],missing=audit.missing||[],renamed=audit.renamed||[];const productList=rows=>rows.length?rows.slice(0,6).map(x=>`${esc(x.name||x.currentName)}（${esc(x.code)}）`).join("、")+(rows.length>6?`等${rows.length}只`:""):"无";return `<section class="qa-grid notes-at-end"><article class="panel"><div class="section-head"><div><span>ETF UNIVERSE CHECK</span><h2>全量ETF逐日变更检查</h2></div></div><div class="qa-stats"><span><b>${data.quality.completeUniverseCount??data.quality.marketEtfCount}</b>交易所完整ETF</span><span><b>${added.length}</b>当日新增</span><span><b>${missing.length}</b>当日消失</span><span><b>${renamed.length}</b>名称变化</span></div><dl class="audit-list"><dt>新增</dt><dd>${productList(added)}</dd><dt>消失</dt><dd>${productList(missing)}</dd><dt>名称变化</dt><dd>${renamed.length?renamed.slice(0,6).map(x=>`${esc(x.previousName)} → ${esc(x.currentName)}（${esc(x.code)}）`).join("、"):"无"}</dd></dl></article><article class="panel methodology"><div class="section-head"><div><span>DATA & METHODOLOGY</span><h2>数据与指标说明</h2></div></div><dl><dt>更新时间</dt><dd>${data.windowStartDate}—${data.tradeDate}，共${data.quality.officialSessions}个交易日；北京时间22:30起持续检查最近交易日完整日终份额，取得新数据并通过全部核验后自动更新。</dd><dt>发布检查</dt><dd>${{verified:"通过",warning:"警告",failed:"未通过"}[data.status]??data.status.toUpperCase()}；完整ETF ${data.quality.marketEtfCount}只，进入资金分析 ${data.quality.classifiedEtfCount}只，覆盖率 ${data.quality.classifiedCoverageOfMarketPct??"—"}%；无法可靠归入既有宽基、风格或行业的A股股票ETF单列展示，不遗漏市场总量。</dd><dt>申万行业覆盖</dt><dd>31个一级行业中${data.quality.industryGroupCount??"—"}个存在可分析ETF，共${data.quality.industryEtfCount??"—"}只；逐日自动对账。</dd><dt>分类口径</dt><dd>${esc(data.methodology.classification)}</dd><dt>资金口径</dt><dd>${esc(data.methodology.flow)}</dd><dt>收益口径</dt><dd>${esc(data.methodology.return)}</dd><dt>坐标轴</dt><dd>${esc(data.methodology.coordinates)}</dd><dt>统计范围</dt><dd>${esc(data.methodology.scope)}</dd></dl></article></section>`}

  function bind(data){
    document.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>openDrawer(data,el.dataset.id));
    document.querySelectorAll("[data-rank-tabs] button").forEach(button=>button.onclick=()=>{document.querySelectorAll("[data-rank-tabs] button").forEach(x=>x.classList.remove("active"));button.classList.add("active");const label={"1d":"当日","5d":"近5日","20d":"近20日"}[button.dataset.period];$("#flow-leaders-title").textContent=`${label}流入领跑 / 流出领跑`;$("#ranking").innerHTML=ranking(data.groups,button.dataset.period,10);$("#ranking").querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>openDrawer(data,el.dataset.id))});
    document.querySelectorAll("[data-kind]").forEach(button=>button.onclick=()=>{document.querySelectorAll("[data-kind]").forEach(x=>x.classList.remove("active"));button.classList.add("active");document.querySelectorAll("[data-kind-row]").forEach(row=>row.hidden=button.dataset.kind!=="all"&&row.dataset.kindRow!==button.dataset.kind)});
    $("#export").onclick=()=>exportJpg(data.tradeDate,"full");$("#export-summary").onclick=()=>exportJpg(data.tradeDate,"summary");
    requestAnimationFrame(layoutBubbleLabels);
  }

  function openDrawer(data,id){const r=data.groups.find(x=>x.id===id),etfs=data.etfs.filter(x=>x.groupId===id);$("#drawer").innerHTML=`<div class="drawer-bg"><button class="drawer-mask" aria-label="关闭"></button><aside class="drawer"><button class="drawer-close">×</button><span>${groupTag(r)} OBSERVATION GROUP</span><h2>${r.name}</h2><div class="drawer-kpis"><article><span>组内ETF参考规模</span><b>${r.aum.toFixed(1)}亿</b></article><article><span>纳入分析ETF</span><b>${etfs.length}只</b></article><article><span>1日资金变化</span><b class="${tone(r.flow1d)}">${money(r.flow1d)}</b></article><article><span>5日累计</span><b class="${tone(r.flow5d)}">${money(r.flow5d)}</b></article><article><span>20日相对收益</span><b class="${tone(r.relativeReturn20d)}">${pct(r.relativeReturn20d)}</b></article></div><div class="drawer-answer"><b>${r.priceFlowState}</b><p>5日资金变化率 ${pct(flowRate(r))}，ETF份额 ${countText(r,"5d")}；当日最大单只产品贡献 ${r.concentration1d.toFixed(1)}%。${r.concentration1d>70?"变化主要来自少数产品，板块代表性较弱。":"变化未明显集中于单只产品。"}</p></div><h3>组内全部ETF（按当日绝对变化排序，共${etfs.length}只）</h3><div class="etf-table">${etfs.map(e=>`<div><span><b>${e.name}</b><small>${e.code} · ${priceTypeName[e.referencePriceType]||e.referencePriceType}</small></span><span>${e.aum.toFixed(1)}亿</span><strong class="${tone(e.flow1d)}">${money(e.flow1d)}</strong></div>`).join("")}</div><p class="drawer-note">参考规模 = 日终总份额 × 当日成交均价（成交额÷成交量），资金变化 = 份额变化 × 当日成交均价；成交均价缺失时依次回退当日收盘价、单位净值。${r.parent?"该组为申万一级行业下的热门主题子组，归属相应一级行业":"该组按ETF名称映射到申万一级行业"}；收益代理为 ${r.representative.name}（${r.representative.code}）。</p></aside></div>`;$(".drawer-mask").onclick=$(".drawer-close").onclick=()=>$("#drawer").innerHTML=""}

  const EXPORT_IMAGE_SPEC=Object.freeze({full:{cssWidth:900,maxPixelRatio:2,maxPixelHeight:7000,maxCanvasPixels:12e6,quality:.99},summary:{cssWidth:900,maxPixelRatio:2,maxPixelHeight:3600,maxCanvasPixels:6.5e6,quality:.99}});

  function exportPixelRatio(spec,width,height){
    return Math.min(spec.maxPixelRatio,spec.maxPixelHeight/height,Math.sqrt(spec.maxCanvasPixels/(width*height)));
  }

  function createExportSnapshot(report,mode){
    const snapshot=report.cloneNode(true),cover=document.createElement("div");
    snapshot.removeAttribute("id");
    snapshot.classList.add("exporting","export-crop","export-snapshot");
    if(mode==="summary")snapshot.classList.add("export-summary");
    snapshot.setAttribute("aria-hidden","true");
    snapshot.style.cssText="position:fixed;left:0;top:0;width:900px;min-width:900px;max-width:900px;margin:0;padding:16px;background:#f2f3f5;pointer-events:none;z-index:90";
    cover.style.cssText="position:fixed;inset:0;z-index:91;display:grid;place-items:center;background:#111318ee;color:#fff;font:600 15px/1.5 PingFang SC,Microsoft YaHei,Arial,sans-serif;letter-spacing:.04em";
    cover.textContent=mode==="summary"?"正在生成结论 JPG…":"正在生成完整 JPG…";
    document.body.append(snapshot,cover);
    return {snapshot,cover};
  }

  async function exportJpg(day,mode){
    const button=$(mode==="summary"?"#export-summary":"#export"),spec=EXPORT_IMAGE_SPEC[mode];
    let stage;
    button.disabled=true;button.textContent="正在生成…";
    try{
      if(!window.__imageExportReady||!window.htmlToImage)throw new Error("图片组件尚未加载，请刷新页面后重试");
      stage=createExportSnapshot($("#report"),mode);
      await document.fonts.ready;
      await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
      const width=spec.cssWidth,height=Math.ceil(stage.snapshot.scrollHeight),pixelRatio=exportPixelRatio(spec,width,height);
      if(pixelRatio<=0||height<=0)throw new Error("图片尺寸计算失败");
      const canvas=await window.htmlToImage.toCanvas(stage.snapshot,{pixelRatio,backgroundColor:"#f2f3f5",cacheBust:true,width,height});
      const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error("JPG 编码失败")),"image/jpeg",spec.quality));
      const label=mode==="summary"?"结论摘要版":"完整客户发送版";
      showSingleExportDownload({url:URL.createObjectURL(blob),filename:`资金ETF流动逐日跟踪_${day}_${mode==="summary"?"结论摘要":"完整版"}.jpg`,width:canvas.width,height:canvas.height},day,label);
    }catch(error){alert(`导出失败：${error.message}`)}
    finally{stage?.cover.remove();stage?.snapshot.remove();button.disabled=false;button.textContent=mode==="summary"?"导出结论 JPG":"导出完整 JPG"}
  }

  function showSingleExportDownload(file,day,label){
    const wrap=document.createElement("div"),close=document.createElement("button"),box=document.createElement("section"),title=document.createElement("h2"),note=document.createElement("p"),link=document.createElement("a"),footer=document.createElement("small");
    wrap.style.cssText="position:fixed;inset:0;z-index:99;background:#111318e6;display:grid;place-items:center;padding:20px";
    box.style.cssText="width:min(460px,100%);background:#fff;border-top:3px solid #a62a3c;padding:24px 20px 20px;text-align:left";
    close.textContent="×";close.setAttribute("aria-label","关闭");close.style.cssText="position:absolute;top:12px;right:14px;width:36px;height:36px;border:0;border-radius:50%;background:#fff;color:#17191e;font-size:23px;cursor:pointer";
    title.textContent=`${label}已生成`;title.style.cssText='margin:0;color:#17191e;font:700 22px "Songti SC","SimSun",serif';
    note.textContent=`单张 JPG，${file.width} × ${file.height} 像素。点击下方直接下载，无需长按或保存图片。`;note.style.cssText="margin:9px 0 16px;color:#646c76;font-size:13px;line-height:1.6";
    link.href=file.url;link.download=file.filename;link.textContent="直接下载 JPG";link.style.cssText="display:block;background:#a62a3c;color:#fff;text-align:center;text-decoration:none;padding:12px;border-radius:2px;font-size:14px;font-weight:700";
    footer.textContent=`${day} · ${label} · 固定尺寸`;footer.style.cssText="display:block;margin-top:13px;color:#8a919a;font-size:11px";
    const dispose=()=>{URL.revokeObjectURL(file.url);wrap.remove()};
    close.onclick=dispose;wrap.append(close,box);box.append(title,note,link,footer);document.body.appendChild(wrap);
  }

  addEventListener("resize",()=>requestAnimationFrame(layoutBubbleLabels));
  load();
  </script>
</body>
</html>
