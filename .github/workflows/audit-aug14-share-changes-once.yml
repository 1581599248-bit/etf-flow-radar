name: One-time audit 2026-08-14 ETF share changes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-aug14-share-changes-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Summarize every 2026-08-14 A-share stock ETF share change
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('site/data/latest.json').read_text('utf-8'))
          u=[x for x in d.get('universe',[]) if x.get('assetScope')=='aShareStockEtf' and x.get('primaryFlow1d') is not None]
          inc=[x for x in u if float(x.get('shareDelta1d') or 0)>0]
          dec=[x for x in u if float(x.get('shareDelta1d') or 0)<0]
          zero=[x for x in u if float(x.get('shareDelta1d') or 0)==0]
          inc_sh=sum(float(x.get('shareDelta1d') or 0) for x in inc)/1e8
          dec_sh=sum(float(x.get('shareDelta1d') or 0) for x in dec)/1e8
          net_sh=inc_sh+dec_sh
          inc_flow=sum(float(x.get('primaryFlow1d') or 0) for x in inc)
          dec_flow=sum(float(x.get('primaryFlow1d') or 0) for x in dec)
          print('COUNT',len(u),'INCREASE',len(inc),'DECREASE',len(dec),'UNCHANGED',len(zero))
          print('SHARES_GROSS_INCREASE_BN',round(inc_sh,2),'SHARES_GROSS_DECREASE_BN',round(dec_sh,2),'SHARES_NET_BN',round(net_sh,2))
          print('VALUE_GROSS_INFLOW_YI',round(inc_flow,2),'VALUE_GROSS_OUTFLOW_YI',round(dec_flow,2),'VALUE_NET_YI',round(inc_flow+dec_flow,2))
          print('\nTOP_SHARE_DECREASES')
          for x in sorted(dec,key=lambda x:float(x.get('shareDelta1d') or 0))[:30]:
              print(x.get('code'),x.get('name'),'delta亿份',round(float(x.get('shareDelta1d') or 0)/1e8,3),'flow亿',x.get('primaryFlow1d'))
          print('\nTOP_SHARE_INCREASES')
          for x in sorted(inc,key=lambda x:float(x.get('shareDelta1d') or 0),reverse=True)[:30]:
              print(x.get('code'),x.get('name'),'delta亿份',round(float(x.get('shareDelta1d') or 0)/1e8,3),'flow亿',x.get('primaryFlow1d'))
          PY
