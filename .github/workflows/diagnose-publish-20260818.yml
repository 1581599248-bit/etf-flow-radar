name: Diagnose 2026-08-18 ETF publication

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-publish-20260818.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - name: Attempt 2026-08-18 build and capture exact reason
        id: build
        shell: bash
        run: |
          set +e
          python data_pipeline/update_daily_v2.py --date 2026-08-18 > /tmp/build.log 2>&1
          code=$?
          set -e
          mkdir -p diagnostics
          {
            echo "exit_code=$code"
            echo "timestamp=$(date -Iseconds)"
            echo "--- build log tail ---"
            tail -n 240 /tmp/build.log
          } > diagnostics/20260818-publish.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Audit and validate if build succeeded
        if: steps.build.outputs.exit_code == '0'
        run: |
          python data_pipeline/audit_snapshot_v6.py
          npm ci
          npm test
      - name: Commit successful report or diagnostic
        shell: bash
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          if [ "${{ steps.build.outputs.exit_code }}" = "0" ]; then
            git add site/data diagnostics/20260818-publish.txt
            msg="data: publish 2026-08-18 ETF report with diagnostic"
          else
            git add diagnostics/20260818-publish.txt
            msg="diag: capture 2026-08-18 ETF publish failure"
          fi
          git diff --cached --quiet && exit 0
          git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
