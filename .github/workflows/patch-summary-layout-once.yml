name: Apply ETF headline summary split once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-summary-layout-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Keep market flow in headline and move breadth/sector summary below
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          py = Path("data_pipeline/update_daily_v2.py")
          text = py.read_text("utf-8")
          text = text.replace('return "A股ETF盘中买卖力量基本均衡"', 'return "A股股票ETF盘中买卖力量基本均衡"')
          text = text.replace('return f"A股ETF盘中{label}，主动买入净额{trade_value:.1f}亿元"', 'return f"A股股票ETF盘中{label}，主动买入净额{trade_value:.1f}亿元"')
          text = text.replace('return f"A股ETF盘中{label}，主动卖出净额{abs(trade_value):.1f}亿元"', 'return f"A股股票ETF盘中{label}，主动卖出净额{abs(trade_value):.1f}亿元"')
          text = text.replace('return f"A股ETF盘中主动买卖数据暂缺；{primary_text}，{motion_text}。"', 'return f"A股股票ETF盘中主动买卖数据暂缺；{primary_text}，{motion_text}。"')
          old = 'snapshot.setdefault("conclusion", {})["headline"] = flow_headline + "\\n" + tail'
          if old not in text:
              old = 'snapshot.setdefault("conclusion", {})["headline"] = flow_headline + tail'
          assert old in text, "headline assignment not found"
          text = text.replace(old, 'snapshot.setdefault("conclusion", {})["headline"] = flow_headline', 1)

          marker = 'snapshot["conclusion"]["facts"] = facts\n'
          assert marker in text, "facts marker not found"
          insert = '''snapshot["conclusion"]["facts"] = facts\n    facts = list(snapshot.setdefault("conclusion", {}).get("facts") or [])\n    broad_summary = f"宽基中{broad_out_count}个流出、{broad_in_count}个流入。"\n    if facts:\n        if not str(facts[0]).startswith("宽基中"):\n            facts[0] = broad_summary + str(facts[0])\n    else:\n        facts = [broad_summary]\n    snapshot["conclusion"]["facts"] = facts\n'''
          text = text.replace(marker, insert, 1)
          py.write_text(text, "utf-8")

          latest = Path("site/data/latest.json")
          if latest.exists():
              payload = json.loads(latest.read_text("utf-8"))
              conclusion = payload.setdefault("conclusion", {})
              headline = str(conclusion.get("headline") or "")
              headline = headline.replace("A股ETF盘中", "A股股票ETF盘中", 1)
              if "\n宽基中" in headline:
                  headline = headline.split("\n宽基中", 1)[0]
              elif "。宽基中" in headline:
                  headline = headline.split("。宽基中", 1)[0] + "。"
              conclusion["headline"] = headline
              facts = list(conclusion.get("facts") or [])
              if facts and not str(facts[0]).startswith("宽基中"):
                  facts[0] = "宽基中18个流出、6个流入。" + str(facts[0])
              conclusion["facts"] = facts
              latest.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", "utf-8")
          PY
      - name: Run deterministic tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - name: Commit narrow change
        shell: bash
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git add data_pipeline/update_daily_v2.py site/data/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "refine ETF headline and summary placement"
          git pull --rebase origin main
          git push origin HEAD:main
