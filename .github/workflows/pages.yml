name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily ETF data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the published real-data snapshot
        run: |
          rm -rf pages-dist/data
          cp -R public/data pages-dist/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
