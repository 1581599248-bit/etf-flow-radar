name: Validate post-close ETF publisher

on:
  push:
    branches:
      - agent/link-postclose-publish

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Run Python regression tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - name: Run frontend validation
        run: npm ci && npm test
