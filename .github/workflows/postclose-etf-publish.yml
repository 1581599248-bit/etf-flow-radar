name: Manual ETF report recovery

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trade date (YYYY-MM-DD); otherwise use the current/latest weekday in Beijing time and wait for complete official shares"
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: manual-etf-recovery-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the single official-share gate workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          if [ -n "$TRADE_DATE" ]; then
            gh workflow run daily-etf-data.yml --ref main -f "trade_date=${TRADE_DATE}"
          else
            gh workflow run daily-etf-data.yml --ref main
          fi
          echo "Recovery request was handed to the official ETF share gate workflow." >> "$GITHUB_STEP_SUMMARY"
