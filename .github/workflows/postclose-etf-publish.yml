name: Publish ETF report after close
# Production contract: unified v7 semantics on top of the validated exchange-share engine.
# Availability rule: migrate and publish the last verified snapshot first, then attempt fresh data.

on:
  workflow_run:
    workflows:
      - "Capture ETF secondary trading facts"
    types:
      - completed
  schedule:
    - cron: "30 9 * * 1-5"   # 17:30 Asia/Shanghai
    - cron: "30 10 * * 1-5"  # 18:30 Asia/Shanghai
    - cron: "0 12 * * 1-5"   # 20:00 Asia/Shanghai
  push:
    branches:
      - main
    paths:
      - "data_pipeline/**"
      - "site/index.html"
      - "scripts/build-site.mjs"
      - ".github/workflows/postclose-etf-publish.yml"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trade date (YYYY-MM-DD); otherwise use the latest captured secondary-trading trade date"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: postclose-etf-publish-unified
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt

      - name: Resolve latest captured trade date
        id: trade
        shell: bash
        run: |
          if [ -n "${{ inputs.trade_date }}" ]; then
            TRADE_DATE="${{ inputs.trade_date }}"
          else
            TRADE_DATE=$(python - <<'PY'
          import json
          from pathlib import Path

          path = Path("site/data/order_flow/latest.json")
          if not path.exists():
              raise SystemExit("site/data/order_flow/latest.json is missing")
          payload = json.loads(path.read_text("utf-8"))
          trade_date = str(payload.get("tradeDate") or "").strip()
          if not trade_date:
              raise SystemExit("latest secondary-trading snapshot has no tradeDate")
          print(trade_date)
          PY
          )
          fi
          echo "trade_date=${TRADE_DATE}" >> "$GITHUB_OUTPUT"
          echo "Post-close publish target: ${TRADE_DATE}"

      - name: Run deterministic pipeline tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"

      # IMPORTANT: keep the client available during a contract rollout or slow
      # fresh-data collection. This migration never invents new market facts;
      # it only upgrades the last already-verified snapshot's schema/semantics.
      - name: Bootstrap last verified snapshot before fresh rebuild
        run: python data_pipeline/migrate_verified_snapshot_v7.py

      - name: Audit bootstrap snapshot
        run: python data_pipeline/audit_snapshot_v7.py

      - name: Validate bootstrap client bundle
        run: npm ci && npm test

      - name: Publish bootstrap snapshot immediately if migration changed data
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git add site/data/latest.json site/data/history
          if ! git diff --cached --quiet; then
            git commit -m "data: publish verified Contract 7 bootstrap snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Attempt unified full report as soon as end-of-day data is ready
        id: build
        continue-on-error: true
        run: timeout 12m python data_pipeline/update_daily_v3.py --date "${{ steps.trade.outputs.trade_date }}"

      - name: Run unified external-send audit
        if: steps.build.outcome == 'success'
        run: python data_pipeline/audit_snapshot_v7.py

      - name: Validate fresh client bundle
        if: steps.build.outcome == 'success'
        run: npm ci && npm test

      - name: Commit verified fresh report immediately
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "data: publish unified ETF report"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Explain deferred fresh-data publication
        if: steps.build.outcome != 'success'
        run: |
          echo "Fresh full report for ${{ steps.trade.outputs.trade_date }} is not publishable yet." >> "$GITHUB_STEP_SUMMARY"
          echo "The last already-verified snapshot remains available under Data Contract 7.0; no old-contract client blanking is required." >> "$GITHUB_STEP_SUMMARY"
          echo "Scheduled retries at 17:30, 18:30 and 20:00, plus the 05:00-08:00 morning workflow, will continue trying to replace it with fresh verified data." >> "$GITHUB_STEP_SUMMARY"
