name: Public ETF flow benchmark

on:
  push:
    branches: [audit/public-flow-benchmark-20260817]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Run deterministic tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - name: Run known 2026-07-31 Wind/iFinD diagnostic
        run: python data_pipeline/benchmark_known_public_20260731.py
      - name: Run primary/secondary metric benchmark
        run: python data_pipeline/benchmark_public_flow_dates.py
      - name: Rebuild 2026-08-14 with schema v6
        run: python data_pipeline/update_daily_v2.py --date "2026-08-14"
      - name: Inspect schema v6 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('site/data/latest.json').read_text('utf-8'))
          assert data['schemaVersion'] == 6
          assert data['market']['metric'] == 'primaryMarketNetSubscriptionEstimate'
          assert data['market']['valuation'] == 'sameDayUnitNAV'
          primary=data['flowMetrics']['primaryMarket']
          assert {'allEtf','stockEtfIncludingCrossBorder','aShareStockEtf'} <= set(primary['scopeTotals'])
          comp=primary['valuationComparisons']['alternatives']['sameDayAverageTradedPrice']['scopeTotals']
          assert {'allEtf','stockEtfIncludingCrossBorder','aShareStockEtf'} <= set(comp)
          assert primary['valuationComparisons']['samplePolicy'] == 'same_etfs_as_canonical_nav_metric'
          assert data['quality']['flowModelVersion'] == 2
          etf=next(x for x in data['etfs'] if x['code']=='588710')
          assert -1.5 < etf['flow1d'] < -1.0, etf
          assert etf['flowValuation'] == 'sameDayUnitNAV'
          assert Path('site/data/daily/2026-08-14.json').exists()
          print('market', data['market'])
          print('valuation comparisons', primary['valuationComparisons'])
          print('secondary', data['flowMetrics']['secondaryMarketOrderFlow'])
          print('588710', etf)
          PY
      - name: Validate client bundle
        run: npm ci && npm test
