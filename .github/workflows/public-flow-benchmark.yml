name: Public ETF flow benchmark

on:
  push:
    branches: [audit/public-flow-benchmark-20260817]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Run cross-date public benchmark
        run: python data_pipeline/benchmark_public_flow_dates.py
