name: ETF system health audit

on:
  push:
    branches:
      - audit/system-health-20260817

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - name: Independent 2026-08-14 flow reconciliation
        run: python data_pipeline/audit_flow_20260814.py
      - name: Build client bundle
        run: npm ci && npm run build
      - name: Check generated client contains clarified endpoint wording
        run: |
          grep -q "5日端点资金变化" dist/index.html
          grep -q "北京时间5:00、6:00、7:00和8:00" dist/index.html
