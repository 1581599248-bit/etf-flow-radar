name: Validate unified ETF system

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-unified-etf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Compile every Python module
        run: python -m compileall -q data_pipeline
      - name: Run all deterministic Python tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build exact-source client and run semantic tests
        run: npm ci && npm test
