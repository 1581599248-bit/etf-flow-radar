name: One-time ETF guarded rebuild

on:
  push:
    paths:
      - ".github/workflows/run-etf-fix-once.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Run pipeline tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - name: Rebuild 2026-08-14 with production guardrails
        run: python data_pipeline/update_daily_production.py --date "2026-08-14"
      - name: Validate published schema and client bundle
        run: npm ci && npm test
      - name: Commit corrected data if verified
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet && exit 0
          git commit -m "data: rebuild 2026-08-14 with production ETF guardrails"
          git push
