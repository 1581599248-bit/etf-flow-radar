name: Restore ETF flow first sentence

on:
  push:
    branches:
      - agent/restore-secondary-first-sentence

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt

      - name: Patch production generator and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("data_pipeline/update_daily_v2.py")
          text = path.read_text("utf-8")
          start = text.index("def _regenerate_v2_conclusion")
          end = text.index("\ndef apply_v2_semantics", start)
          new_block = '''def _regenerate_v2_conclusion(snapshot: dict[str, Any]) -> None:\n    \"\"\"Build both homepage flow sentences without mixing their meanings.\n\n    Sentence 1 is the same-day secondary-market ETF trading-flow estimate when\n    that same-day fact was captured. Sentence 2 is always the canonical A-share\n    stock ETF T-day primary-market net subscription/redemption estimate:\n    (T shares - comparable T-1 shares) * T NAV.  Missing secondary-market data\n    must never suppress or replace the canonical T-day flow.\n    \"\"\"\n    production._regenerate_conclusion(snapshot)\n    old = str(snapshot.get(\"conclusion\", {}).get(\"headline\") or \"\")\n    tail = \"\"\n    if \"宽基中\" in old:\n        tail = \"宽基中\" + old.split(\"宽基中\", 1)[1]\n\n    market = snapshot[\"market\"]\n    primary_value = market.get(\"flow1d\")\n    if not isinstance(primary_value, (int, float)):\n        raise ValueError(\"A-share stock ETF market.flow1d is required for the homepage headline\")\n\n    trade_scope = (\n        snapshot.get(\"flowMetrics\", {})\n        .get(\"secondaryMarketTradeFlow\", {})\n        .get(\"scopeTotals\", {})\n        .get(\"aShareStockEtf\", {})\n    )\n    trade_value = trade_scope.get(\"netFlow1d\")\n    if isinstance(trade_value, (int, float)):\n        first = f\"A股ETF当日成交资金{_flow_phrase(float(trade_value))}；\"\n    else:\n        first = \"A股ETF当日成交资金暂无同日数据；\"\n\n    second = (\n        f\"A股股票ETF当日合计{_flow_phrase(float(primary_value))}；\"\n        f\"{market.get('increaseEtfCount1d', 0)}只份额增加、\"\n        f\"{market.get('decreaseEtfCount1d', 0)}只份额减少、\"\n        f\"{market.get('unchangedEtfCount1d', 0)}只不变。\"\n    )\n    snapshot.setdefault(\"conclusion\", {})[\"headline\"] = first + second + tail\n\n'''
          text = text[:start] + new_block + text[end + 1:]

          old_method = '"metricSeparation": "首页主结论只使用A股股票ETF当日净申购/赎回估算（交易所日终份额变化×T日NAV）。二级市场成交方向和主力净额属于独立辅助统计；无论其是否有同日数据，都不得覆盖或阻断首页主结论。",'
          new_method = '"metricSeparation": "首页保留两句独立口径：第一句展示A股ETF同日二级市场成交资金净额（仅在同日成交额+外盘/内盘快照成功落盘时给出数值）；第二句固定展示A股股票ETF当日净申购/赎回估算（交易所T日/T-1可比份额变化×T日NAV）。第一句缺失或数值变化均不得覆盖第二句。",'
          if old_method not in text:
              raise SystemExit("expected metricSeparation text not found")
          text = text.replace(old_method, new_method, 1)
          path.write_text(text, "utf-8")

          test_path = Path("data_pipeline/test_update_daily_v2.py")
          tests = test_path.read_text("utf-8")
          tests = tests.replace(
              '        self.assertIn("A股股票ETF当日合计净流出48.3亿元", headline)\n        self.assertIn("231只份额增加、409只份额减少、607只不变", headline)\n        self.assertNotIn("成交资金净流入198.4亿元", headline)\n        self.assertNotIn("暂无同日数据", headline)\n        self.assertNotIn("ETF份额较上一日", headline)',
              '        self.assertIn("A股ETF当日成交资金净流入198.4亿元", headline)\n        self.assertIn("A股股票ETF当日合计净流出48.3亿元", headline)\n        self.assertIn("231只份额增加、409只份额减少、607只不变", headline)\n        self.assertNotIn("暂无同日数据", headline)\n        self.assertNotIn("ETF份额较上一日", headline)',
              1,
          )
          tests = tests.replace(
              '        self.assertIn("A股股票ETF当日合计净流入12.6亿元", headline)\n        self.assertNotIn("暂无同日数据", headline)',
              '        self.assertIn("A股ETF当日成交资金暂无同日数据", headline)\n        self.assertIn("A股股票ETF当日合计净流入12.6亿元", headline)',
              1,
          )
          test_path.write_text(tests, "utf-8")
          PY

      - run: pip install -r data_pipeline/requirements.txt
      - name: Run deterministic pipeline tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"

      - name: Regenerate stored headline through production code
        env:
          PYTHONPATH: data_pipeline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import update_daily_v2 as v2

          paths = [Path("site/data/latest.json")]
          latest = json.loads(paths[0].read_text("utf-8"))
          trade_date = latest.get("tradeDate")
          if trade_date:
              history = Path("site/data/history") / f"{trade_date}.json"
              if history.exists():
                  paths.append(history)

          for path in paths:
              data = json.loads(path.read_text("utf-8"))
              v2._regenerate_v2_conclusion(data)
              headline = data["conclusion"]["headline"]
              if "A股ETF当日成交资金" not in headline:
                  raise SystemExit(f"secondary first sentence missing in {path}")
              if "A股股票ETF当日合计" not in headline:
                  raise SystemExit(f"canonical second sentence missing in {path}")
              if "ETF份额较上一日" in headline:
                  raise SystemExit(f"misleading legacy wording survived in {path}")
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", "utf-8")
          PY

      - name: Validate client bundle
        run: npm ci && npm test && npm run build --if-present

      - name: Commit verified fix and remove temporary workflow
        run: |
          rm .github/workflows/agent-restore-secondary-first-sentence.yml
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git add data_pipeline/update_daily_v2.py data_pipeline/test_update_daily_v2.py site/data/latest.json site/data/history .github/workflows/agent-restore-secondary-first-sentence.yml
          git commit -m "fix: restore secondary ETF flow sentence alongside canonical flow"
          git push
