name: Repair 2026-08-18 ETF report now
# Final one-shot repair after shared cache, SSE throttling and publisher serialization.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-20260818-now.yml"

permissions:
  contents: write

concurrency:
  group: etf-full-publish-v2
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - name: Restore verified official-share cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/exchange_shares
          key: etf-exchange-shares-v1-repair-${{ github.run_id }}
          restore-keys: |
            etf-exchange-shares-v1-
      - run: pip install -r data_pipeline/requirements.txt
      - name: Run 2026-08-18 pipeline and capture result
        id: build
        shell: bash
        run: |
          set +e
          timeout 20m python data_pipeline/update_daily_v2.py --date 2026-08-18 > /tmp/repair.log 2>&1
          code=$?
          set -e
          mkdir -p diagnostics
          {
            echo "exit_code=$code"
            echo "timestamp=$(date -Iseconds)"
            echo "--- log ---"
            cat /tmp/repair.log
          } > diagnostics/repair-20260818.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Save verified official-share cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/exchange_shares
          key: etf-exchange-shares-v1-repair-${{ github.run_id }}
      - name: Audit successful build
        if: steps.build.outputs.code == '0'
        run: |
          python data_pipeline/audit_snapshot_v6.py
          npm ci
          npm test
      - name: Commit report or exact failure
        shell: bash
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git add diagnostics/repair-20260818.txt
          if [ "${{ steps.build.outputs.code }}" = "0" ]; then
            git add site/data
            msg="data: repair and publish 2026-08-18 ETF report"
          else
            msg="diag: capture serialized cached 2026-08-18 publish failure"
          fi
          git diff --cached --quiet && exit 0
          git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
