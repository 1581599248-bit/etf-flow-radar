name: Repair 2026-08-18 ETF report now
# Explicit retrigger after SSE transport repair.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-20260818-now.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Run 2026-08-18 pipeline and capture result
        id: build
        shell: bash
        run: |
          set +e
          timeout 18m python data_pipeline/update_daily_v2.py --date 2026-08-18 > /tmp/repair.log 2>&1
          code=$?
          set -e
          mkdir -p diagnostics
          {
            echo "exit_code=$code"
            echo "timestamp=$(date -Iseconds)"
            echo "--- log ---"
            cat /tmp/repair.log
          } > diagnostics/repair-20260818.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Audit successful build
        if: steps.build.outputs.code == '0'
        run: |
          python data_pipeline/audit_snapshot_v6.py
          npm ci
          npm test
      - name: Commit report or exact failure
        shell: bash
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git add diagnostics/repair-20260818.txt
          if [ "${{ steps.build.outputs.code }}" = "0" ]; then
            git add site/data
            msg="data: repair and publish 2026-08-18 ETF report"
          else
            msg="diag: capture exact 2026-08-18 publish failure"
          fi
          git diff --cached --quiet && exit 0
          git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
