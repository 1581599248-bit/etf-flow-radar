name: Fix schema-v6 client validation

on:
  push:
    branches:
      - agent/fix-v6-client-validation

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - name: Align stale client assertions with current schema v6
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/rendered-html.test.mjs")
          text = path.read_text("utf-8")
          replacements = {
              "marketRecon.aShareEquityPrimaryFlow1d": "marketRecon.aShareEquityShareFlow1d",
              "marketRecon.classifiedGroupPrimaryFlow1d": "marketRecon.classifiedGroupShareFlow1d",
              "assert.match(snapshot.methodology.metricSeparation, /两个不同变量/);": "assert.match(snapshot.methodology.metricSeparation, /两句独立口径/);",
              "assert.match(snapshot.methodology.scope, /全部ETF、股票ETF（含跨境）和A股股票ETF/);": "assert.match(snapshot.methodology.scope, /A股股票ETF范围/);\n  assert.match(snapshot.methodology.scope, /股票ETF（含跨境）/);",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"stale assertion not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, "utf-8")

          workflow = Path(".github/workflows/postclose-etf-publish.yml")
          wtext = workflow.read_text("utf-8")
          marker = "name: Publish ETF report after close\n"
          replacement = "name: Publish ETF report after close\n# Publisher schema: v1; changes to this file bootstrap the latest captured trade date.\n"
          if "# Publisher schema: v1" not in wtext:
              if marker not in wtext:
                  raise SystemExit("publisher workflow header not found")
              wtext = wtext.replace(marker, replacement, 1)
              workflow.write_text(wtext, "utf-8")
          PY
      - run: pip install -r data_pipeline/requirements.txt
      - name: Run Python regression tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - name: Run frontend validation
        run: npm ci && npm test
      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          rm .github/workflows/agent-fix-v6-validation.yml
          git add tests/rendered-html.test.mjs .github/workflows/postclose-etf-publish.yml .github/workflows/agent-fix-v6-validation.yml
          git commit -m "test: align schema-v6 client validation"
          git push
