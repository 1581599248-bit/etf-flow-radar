name: Backfill Aug 17 ETF trading flow

on:
  push:
    branches:
      - agent/backfill-20260817-trading-flow

permissions:
  contents: write

concurrency:
  group: agent-backfill-20260817-trading-flow
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Capture Aug 17 with schema v2
        run: python data_pipeline/capture_order_flow_v2.py --date 2026-08-17
      - name: Commit refreshed same-day fact
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git add site/data/order_flow/2026-08-17.json site/data/order_flow/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "data: backfill Aug 17 ETF trading flow"
          git push
