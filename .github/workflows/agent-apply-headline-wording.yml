name: Apply and validate ETF headline wording

on:
  push:
    branches:
      - agent/simplify-etf-flow-headline

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r data_pipeline/requirements.txt
      - name: Apply final client-facing wording
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("data_pipeline/update_daily_v2.py"): [
                  ("当日交易净流入/净流出", "当日成交资金净流入/净流出"),
                  ("ETF份额净流入/净流出", "ETF份额较上一日净流入/净流出"),
                  ('first = f"A股ETF当日交易{_flow_phrase(float(trade_value))}；"', 'first = f"A股ETF当日成交资金{_flow_phrase(float(trade_value))}；"'),
                  ('first = "A股ETF当日交易净额暂无同日数据；"', 'first = "A股ETF当日成交资金暂无同日数据；"'),
                  ('f"ETF份额{_flow_phrase(share_value)}，"', 'f"ETF份额较上一日{_flow_phrase(share_value)}，"'),
              ],
              Path("data_pipeline/test_update_daily_v2.py"): [
                  ("A股ETF当日交易净流入198.4亿元", "A股ETF当日成交资金净流入198.4亿元"),
                  ("ETF份额净流出48.3亿元", "ETF份额较上一日净流出48.3亿元"),
              ],
              Path("README.md"): [
                  ("当日交易资金", "当日成交资金"),
                  ("当日交易净流入/净流出", "当日成交资金净流入/净流出"),
                  ("ETF份额净流入/净流出", "ETF份额较上一日净流入/净流出"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text("utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"expected text not found in {path}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, "utf-8")
      - name: Python tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Commit verified wording change
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git rm .github/workflows/agent-apply-headline-wording.yml
          git add data_pipeline/update_daily_v2.py data_pipeline/test_update_daily_v2.py README.md
          git commit -m "fix: simplify ETF flow headline wording"
          git push
