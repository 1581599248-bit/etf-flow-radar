name: Diagnose ETF publication 2026-08-18

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-20260818.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r data_pipeline/requirements.txt
      - name: Test official SSE browser-session transport only
        shell: bash
        run: |
          set +e
          PYTHONPATH=data_pipeline python - <<'PY' > /tmp/sse.log 2>&1
          from datetime import date
          import update_daily_resilient as r
          day = date(2026, 8, 18)
          try:
              frame = r._browser_session_sse_shares(day)
              print(f"status=success rows={len(frame)} date={sorted(frame['统计日期'].unique())[:3]} unit={frame.attrs.get('share_unit_normalization')}")
              print(frame[['基金代码','基金简称','基金份额']].head(5).to_string(index=False))
          except Exception as exc:
              print(f"status=failed type={type(exc).__name__} error={exc}")
              raise
          PY
          code=$?
          set -e
          mkdir -p diagnostics
          {
            echo "timestamp=$(date -Iseconds)"
            echo "exit_code=$code"
            cat /tmp/sse.log
          } > diagnostics/2026-08-18-sse-transport.txt
      - name: Commit transport diagnostic
        shell: bash
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git add diagnostics/2026-08-18-sse-transport.txt
          git diff --cached --quiet && exit 0
          git commit -m "diag: record SSE transport result"
          git pull --rebase origin main
          git push origin HEAD:main
