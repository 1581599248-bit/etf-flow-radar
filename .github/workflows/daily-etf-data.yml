name: Daily ETF data

on:
  schedule:
    - cron: "15 16 * * 1-5" # 00:15 Asia/Shanghai, Tuesday-Saturday
    - cron: "30 16 * * 1-5" # 00:30 Asia/Shanghai, Tuesday-Saturday
    - cron: "0 17 * * 1-5"  # 01:00 Asia/Shanghai, Tuesday-Saturday
    - cron: "0 21 * * 1-5"  # 05:00 Asia/Shanghai, Tuesday-Saturday
    - cron: "0 22 * * 1-5"  # 06:00 Asia/Shanghai, Tuesday-Saturday
    - cron: "0 23 * * 1-5"  # 07:00 Asia/Shanghai, Tuesday-Saturday
    - cron: "0 0 * * 2-6"   # 08:00 Asia/Shanghai, Tuesday-Saturday final pre-open retry

  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trade date (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-etf-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Run deterministic pipeline tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - name: Build guarded verified snapshot
        run: |
          if [ -n "${{ inputs.trade_date }}" ]; then
            python data_pipeline/update_daily_production.py --date "${{ inputs.trade_date }}"
          else
            python data_pipeline/update_daily_production.py
          fi
      - name: Validate published schema and client bundle
        run: npm ci && npm test
      - name: Commit only a verified change
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet && exit 0
          git commit -m "data: update guarded verified ETF snapshot"
          git push
