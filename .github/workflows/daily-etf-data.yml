name: Daily ETF data

on:
  schedule:
    - cron: "*/5 5-6 * * 1-5" # temporary catch-up window: 13:00-14:59 Asia/Shanghai
    - cron: "0 21 * * 1-5"  # 05:00 Asia/Shanghai, Tuesday-Saturday
    - cron: "0 22 * * 1-5"  # 06:00 Asia/Shanghai, Tuesday-Saturday
    - cron: "0 23 * * 1-5"  # 07:00 Asia/Shanghai, Tuesday-Saturday
    - cron: "0 0 * * 2-6"   # 08:00 Asia/Shanghai, Tuesday-Saturday final pre-open retry
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-etf-data.yml"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trade date (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-etf-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Resolve target trade date
        id: trade
        shell: bash
        run: |
          if [ -n "${{ inputs.trade_date }}" ]; then
            TRADE_DATE="${{ inputs.trade_date }}"
          else
            TRADE_DATE=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path("site/data/order_flow/latest.json")
          payload = json.loads(path.read_text("utf-8"))
          value = str(payload.get("tradeDate") or "").strip()
          if not value:
              raise SystemExit("order-flow latest has no tradeDate")
          print(value)
          PY
          )
          fi
          echo "trade_date=${TRADE_DATE}" >> "$GITHUB_OUTPUT"
          echo "Target trade date: ${TRADE_DATE}"
      - name: Run deterministic pipeline tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - name: Build schema-v6 production snapshot and capture failure reason
        id: build
        shell: bash
        run: |
          set +e
          python data_pipeline/update_daily_v2.py --date "${{ steps.trade.outputs.trade_date }}" > /tmp/etf-build.log 2>&1
          code=$?
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            mkdir -p diagnostics
            {
              echo "trade_date=${{ steps.trade.outputs.trade_date }}"
              echo "generated_at=$(date -Iseconds)"
              echo "exit_code=${code}"
              echo "--- build log ---"
              cat /tmp/etf-build.log
            } > diagnostics/latest-etf-publish-failure.txt
          fi
      - name: Run external-send reconciliation audit
        if: steps.build.outputs.exit_code == '0'
        run: python data_pipeline/audit_snapshot_v6.py
      - name: Validate published schema and client bundle
        if: steps.build.outputs.exit_code == '0'
        run: npm ci && npm test
      - name: Commit verified report or failure diagnostic
        shell: bash
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          if [ "${{ steps.build.outputs.exit_code }}" = "0" ]; then
            rm -f diagnostics/latest-etf-publish-failure.txt
            git add site/data diagnostics/latest-etf-publish-failure.txt
            msg="data: update schema-v6 ETF flow snapshot"
          else
            git add diagnostics/latest-etf-publish-failure.txt
            msg="diag: capture ETF publish failure"
          fi
          git diff --cached --quiet && exit 0
          git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail workflow after diagnostic is persisted
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
