name: Daily ETF data

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "site/data/**"
  schedule:
    - cron: "30 23 * * 1-5" # 07:30 Asia/Shanghai, Tuesday-Saturday
    - cron: "0 0 * * 2-6"   # 08:00 Asia/Shanghai, Tuesday-Saturday
    - cron: "30 0 * * 2-6"  # 08:30 Asia/Shanghai, Tuesday-Saturday
    - cron: "0 1 * * 2-6"   # 09:00 Asia/Shanghai final pre-open retry
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trade date (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-etf-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Run deterministic pipeline tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - name: Build verified V2 snapshot
        run: |
          if [ -n "${{ inputs.trade_date }}" ]; then
            python data_pipeline/update_daily_v2.py --date "${{ inputs.trade_date }}"
          else
            python data_pipeline/update_daily_v2.py
          fi
      - name: Validate V2 client bundle
        run: npm ci && npm test
      - name: Commit only a verified change
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet && exit 0
          git commit -m "data: update verified ETF snapshot v2"
          git push
