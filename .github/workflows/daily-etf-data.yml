name: Official ETF share gate and publish

on:
  # A workflow-definition change is also a controlled recovery trigger: it
  # validates and republishes the current official snapshot once with all active guardrails.
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-etf-data.yml"
  schedule:
    # Beijing 22:30 to 01:30: probe every 30 minutes.  Each run makes one
    # bounded exact-date check; the next clock slot is the retry mechanism.
    - cron: "30 14 * * 1-5"       # 22:30 Asia/Shanghai
    - cron: "0,30 15 * * 1-5"     # 23:00 / 23:30 Asia/Shanghai
    - cron: "0,30 16 * * 1-5"     # 00:00 / 00:30 Asia/Shanghai
    - cron: "0,30 17 * * 1-5"     # 01:00 / 01:30 Asia/Shanghai
    - cron: "20 0,4 * * 2-6"      # 08:20 / 12:20 Asia/Shanghai
    # Friday data keeps retrying through the weekend until it is published.
    - cron: "23 1,5,9 * * 0,6"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trade date (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # All entry points publish the same latest.json, so never run two publishers
  # concurrently.  A waiting run rechecks the target date and exits if done.
  group: official-etf-share-gate
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trade_date: ${{ steps.target.outputs.trade_date }}
      needed: ${{ steps.target.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Resolve target and skip an already published date
        id: target
        shell: bash
        env:
          REQUESTED_TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from data_pipeline.resolve_publication_target import resolve_target

          requested = os.environ.get("REQUESTED_TRADE_DATE", "").strip()
          # Primary-market publication is intentionally independent of optional
          # intraday order-flow capture.  Exact SSE/SZSE probes below decide
          # whether this calendar target has complete official data.
          target = resolve_target(requested).isoformat()

          published = ""
          published_path = Path("site/data/latest.json")
          if published_path.exists():
              published = str(json.loads(published_path.read_text("utf-8")).get("tradeDate") or "")

          # A workflow-definition push is an explicit controlled recovery run;
          # it may rebuild the current official snapshot once.  Routine source
          # changes do not trigger this workflow, so they cannot duplicate a
          # live publisher.
          force_rebuild = bool(requested) or os.environ.get("GITHUB_EVENT_NAME") == "push"
          needed = force_rebuild or target != published
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"trade_date={target}\n")
              output.write(f"needed={'true' if needed else 'false'}\n")
          print(
              f"target={target}; published={published or 'none'}; "
              f"force_rebuild={force_rebuild}; needed={needed}"
          )
          PY

  probe:
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - name: Restore verified official-share cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/exchange_shares
          key: etf-exchange-shares-v2-${{ github.run_id }}-probe
          restore-keys: |
            etf-exchange-shares-v2-
            etf-exchange-shares-v1-
      - run: pip install -r data_pipeline/requirements.txt
      - name: Probe one exact official SSE/SZSE date
        id: official
        shell: bash
        run: |
          attempts=1
          code=75
          for attempt in $(seq 1 "$attempts"); do
            set +e
            timeout 4m python data_pipeline/probe_official_shares.py \
              --date "${{ needs.resolve.outputs.trade_date }}" \
              --status-file "/tmp/official-share-probe.json"
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then break; fi
            break
          done
          cat "/tmp/official-share-probe.json" >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$code" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            mkdir -p .probe-output
            cp ".cache/exchange_shares/${{ needs.resolve.outputs.trade_date }}.json" .probe-output/
          elif [ "$code" -eq 75 ] || [ "$code" -eq 124 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Official shares are not ready after the internal retry window; a backup run will retry." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi
      - name: Pass verified official shares to publisher
        if: steps.official.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: official-share-verified
          path: .probe-output/${{ needs.resolve.outputs.trade_date }}.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - resolve
      - probe
    if: always() && needs.resolve.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Shanghai
      # Official share and same-day secondary facts are the daily publication
      # gate.  Non-essential return proxies must not hold the report hostage.
      ETF_SKIP_RETURN_PROXIES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore verified official-share cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/exchange_shares
          key: etf-exchange-shares-v2-${{ github.run_id }}-publisher
          restore-keys: |
            etf-exchange-shares-v2-
            etf-exchange-shares-v1-
      - name: Download verified official-share probe
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: official-share-*
          path: .probe-artifacts
      - name: Select and reconcile a verified probe result
        id: gate
        shell: bash
        env:
          TARGET_TRADE_DATE: ${{ needs.resolve.outputs.trade_date }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          target = os.environ["TARGET_TRADE_DATE"]
          candidates = sorted(Path(".probe-artifacts").rglob(f"{target}.json"))
          output = Path(os.environ["GITHUB_OUTPUT"])
          if not candidates:
              with output.open("a", encoding="utf-8") as handle:
                  handle.write("ready=false\n")
              print("The official-share probe did not obtain both exchanges; wait for the next schedule.")
              raise SystemExit(0)

          payloads = [json.loads(path.read_text("utf-8")) for path in candidates]
          fingerprints = set()
          for payload in payloads:
              if payload.get("tradeDate") != target:
                  raise SystemExit("probe artifact date mismatch")
              rows = sorted(payload.get("rows", []), key=lambda row: (row.get("exchange"), row.get("code")))
              canonical = json.dumps(rows, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              fingerprints.add(hashlib.sha256(canonical.encode("utf-8")).hexdigest())
          if len(fingerprints) != 1:
              raise SystemExit("independent official-share probes disagree; publication blocked")

          cache_dir = Path(".cache/exchange_shares")
          cache_dir.mkdir(parents=True, exist_ok=True)
          target_path = cache_dir / f"{target}.json"
          target_path.write_text(json.dumps(payloads[0], ensure_ascii=False, separators=(",", ":")), "utf-8")
          with output.open("a", encoding="utf-8") as handle:
              handle.write("ready=true\n")
          print(f"verified official-share probe artifacts={len(payloads)}; cache={target_path}")
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - name: Install production dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pip install -r data_pipeline/requirements.txt
      - name: Revalidate selected official cache
        if: steps.gate.outputs.ready == 'true'
        run: |
          python data_pipeline/probe_official_shares.py \
            --date "${{ needs.resolve.outputs.trade_date }}" \
            --status-file /tmp/official-share-selected.json
      - name: Run deterministic pipeline tests
        if: steps.gate.outputs.ready == 'true'
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - name: Build and audit schema-v6 production snapshot
        if: steps.gate.outputs.ready == 'true'
        id: build
        shell: bash
        run: |
          set +e
          timeout 25m python data_pipeline/update_daily_v2.py \
            --date "${{ needs.resolve.outputs.trade_date }}" > /tmp/etf-build.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            python data_pipeline/audit_snapshot_v6.py > /tmp/etf-audit.log 2>&1
            code=$?
          fi
          set -e
          cat /tmp/etf-build.log
          cat /tmp/etf-audit.log 2>/dev/null || true
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            mkdir -p diagnostics
            {
              echo "trade_date=${{ needs.resolve.outputs.trade_date }}"
              echo "generated_at=$(date -Iseconds)"
              echo "exit_code=${code}"
              echo "official_probe=verified"
              echo "--- audit log ---"
              cat /tmp/etf-audit.log 2>/dev/null || true
              echo "--- build log ---"
              cat /tmp/etf-build.log
            } > diagnostics/latest-etf-publish-failure.txt
          fi
      - name: Save verified official-share cache
        if: always() && steps.gate.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/exchange_shares
          key: etf-exchange-shares-v2-${{ github.run_id }}-publisher
      - name: Validate published schema and client bundle
        if: steps.gate.outputs.ready == 'true' && steps.build.outputs.exit_code == '0'
        run: npm ci && npm test
      - name: Commit verified report or build diagnostic
        if: steps.gate.outputs.ready == 'true' && steps.build.outputs.exit_code != ''
        shell: bash
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          if [ "${{ steps.build.outputs.exit_code }}" = "0" ]; then
            rm -f diagnostics/latest-etf-publish-failure.txt
            message="data: publish verified official ETF share snapshot"
          else
            message="diag: capture post-probe ETF build failure"
          fi
          git add site/data diagnostics/
          git diff --cached --quiet && exit 0
          git commit -m "$message"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail only after a verified-source build error is persisted
        if: steps.gate.outputs.ready == 'true' && steps.build.outputs.exit_code != '0'
        run: exit 1

  notify:
    name: WeChat alert on failure
    needs:
      - resolve
      - probe
      - publish
    if: >-
      always() && (needs.resolve.result == 'failure' ||
      needs.probe.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send PushPlus WeChat alert
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          PROBE_RESULT: ${{ needs.probe.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          TRADE_DATE: ${{ needs.resolve.outputs.trade_date }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "PUSHPLUS_TOKEN secret not configured; skipping WeChat alert"
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          export RUN_URL RESOLVE_RESULT PROBE_RESULT PUBLISH_RESULT TRADE_DATE PUSHPLUS_TOKEN
          python3 - <<'PY' || true
          import json
          import os
          import urllib.request

          stage = "publish"
          if os.environ.get("RESOLVE_RESULT") == "failure":
              stage = "resolve"
          elif os.environ.get("PROBE_RESULT") == "failure":
              stage = "probe"
          import datetime
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime("%m-%d %H:%M")
          payload = {
              "token": os.environ["PUSHPLUS_TOKEN"],
              "title": "ETF日报发布失败提醒",
              "content": (
                  f"交易日: {os.environ.get('TRADE_DATE') or '未知'}\n"
                  f"时间: {now} 北京\n"
                  f"失败环节: {stage}（已自动重试仍未通过）\n"
                  f"详情: {os.environ['RUN_URL']}"
              ),
              "template": "txt",
          }
          req = urllib.request.Request(
              "http://www.pushplus.plus/send",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          print(urllib.request.urlopen(req, timeout=30).read().decode("utf-8"))
          PY
