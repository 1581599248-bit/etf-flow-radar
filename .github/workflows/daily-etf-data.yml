name: Daily ETF data

on:
  schedule:
    - cron: "30 12 * * 1-5" # 20:30 Asia/Shanghai: first check for the current trading day's closing shares
    - cron: "0 15 * * 1-5"  # 23:00 Asia/Shanghai: same-day retry for a late exchange release
    - cron: "15 1 * * 2-6"  # 09:15 Asia/Shanghai: next-morning retry when the exchange published later
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trade date (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-etf-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Run deterministic pipeline tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - name: Build verified snapshot
        run: |
          if [ -n "${{ inputs.trade_date }}" ]; then
            python data_pipeline/update_daily.py --date "${{ inputs.trade_date }}"
          else
            python data_pipeline/update_daily.py
          fi
      - name: Validate published schema and client bundle
        run: npm ci && npm test
      - name: Commit only a verified change
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet && exit 0
          git commit -m "data: update verified ETF snapshot"
          git push
