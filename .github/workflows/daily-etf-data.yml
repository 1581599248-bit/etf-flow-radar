name: Daily ETF data

on:
  schedule:
    # Official ETF shares usually become available late on the trade date.
    # Publish as soon as the official SSE/SZSE data passes validation.
    - cron: "5 15 * * 1-5"  # 23:05 Asia/Shanghai
    - cron: "35 15 * * 1-5" # 23:35 Asia/Shanghai
    - cron: "5 16 * * 1-5"  # 00:05 Asia/Shanghai
    - cron: "35 16 * * 1-5" # 00:35 Asia/Shanghai
    # Re-run the most recent trade date throughout the weekend if Friday missed.
    - cron: "0 1,5,9 * * 0,6" # 09:00, 13:00, 17:00 Asia/Shanghai, Sat/Sun
    # Morning retries remain only as a fail-safe for delayed exchange publication.
    - cron: "0 21 * * 1-5"  # 05:00 Asia/Shanghai, Tuesday-Saturday
    - cron: "0 22 * * 1-5"  # 06:00 Asia/Shanghai, Tuesday-Saturday
    - cron: "0 23 * * 1-5"  # 07:00 Asia/Shanghai, Tuesday-Saturday
    - cron: "0 0 * * 2-6"   # 08:00 Asia/Shanghai, Tuesday-Saturday final retry
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-etf-data.yml"
      - "data_pipeline/update_daily_resilient.py"
      - "data_pipeline/update_daily_v2.py"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trade date (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: etf-full-publish-v2
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - name: Restore verified official-share cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/exchange_shares
          key: etf-exchange-shares-v1-${{ github.run_id }}
          restore-keys: |
            etf-exchange-shares-v1-
      - run: pip install -r data_pipeline/requirements.txt
      - name: Resolve target trade date
        id: trade
        shell: bash
        run: |
          if [ -n "${{ inputs.trade_date }}" ]; then
            TRADE_DATE="${{ inputs.trade_date }}"
          else
            TRADE_DATE=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path("site/data/order_flow/latest.json")
          payload = json.loads(path.read_text("utf-8"))
          value = str(payload.get("tradeDate") or "").strip()
          if not value:
              raise SystemExit("order-flow latest has no tradeDate")
          print(value)
          PY
          )
          fi
          echo "trade_date=${TRADE_DATE}" >> "$GITHUB_OUTPUT"
          echo "Target trade date: ${TRADE_DATE}"
      - name: Run deterministic pipeline tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - name: Build schema-v6 production snapshot and capture failure reason
        id: build
        shell: bash
        run: |
          set +e
          timeout 20m python data_pipeline/update_daily_v2.py --date "${{ steps.trade.outputs.trade_date }}" > /tmp/etf-build.log 2>&1
          code=$?
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            mkdir -p diagnostics
            {
              echo "trade_date=${{ steps.trade.outputs.trade_date }}"
              echo "generated_at=$(date -Iseconds)"
              echo "exit_code=${code}"
              echo "--- build log ---"
              cat /tmp/etf-build.log
            } > diagnostics/latest-etf-publish-failure.txt
          fi
      - name: Save verified official-share cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/exchange_shares
          key: etf-exchange-shares-v1-${{ github.run_id }}
      - name: Run external-send reconciliation audit
        if: steps.build.outputs.exit_code == '0'
        run: python data_pipeline/audit_snapshot_v6.py
      - name: Validate published schema and client bundle
        if: steps.build.outputs.exit_code == '0'
        run: npm ci && npm test
      - name: Commit verified report or failure diagnostic
        shell: bash
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          if [ "${{ steps.build.outputs.exit_code }}" = "0" ]; then
            rm -f diagnostics/latest-etf-publish-failure.txt
            msg="data: update schema-v6 ETF flow snapshot"
          else
            msg="diag: capture ETF publish failure"
          fi
          # 按目录暂存：诊断文件被 rm 删除或本就不存在时，
          # 对单文件 pathspec 执行 git add 会直接报错（06:00 连续成功后的
          # 第二次发布正是这样失败的），目录形式两种情况都安全。
          git add site/data diagnostics/
          git diff --cached --quiet && exit 0
          git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail workflow after diagnostic is persisted
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
