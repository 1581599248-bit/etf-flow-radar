name: Apply headline line-break fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-headline-linebreak.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Patch only headline line break behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          py = Path("data_pipeline/update_daily_v2.py")
          text = py.read_text("utf-8")
          old = 'snapshot.setdefault("conclusion", {})["headline"] = flow_headline + tail'
          new = 'snapshot.setdefault("conclusion", {})["headline"] = flow_headline + "\\n" + tail'
          assert old in text, "headline generator target not found"
          py.write_text(text.replace(old, new, 1), "utf-8")

          css = Path("site/styles.css")
          text = css.read_text("utf-8")
          old = '.conclusion>h3{font:700 19px/1.55 "Songti SC","SimSun",serif;margin:7px 0 12px;max-width:1200px}'
          new = '.conclusion>h3{font:700 19px/1.55 "Songti SC","SimSun",serif;margin:7px 0 12px;max-width:1200px;white-space:pre-line}'
          assert old in text, "headline css target not found"
          css.write_text(text.replace(old, new, 1), "utf-8")

          latest = Path("site/data/latest.json")
          text = latest.read_text("utf-8")
          if '。\\n宽基中' not in text:
              assert '。宽基中' in text, "persisted headline split point not found"
              latest.write_text(text.replace('。宽基中', '。\\n宽基中', 1), "utf-8")
          PY
      - name: Run deterministic tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - name: Commit narrow fix
        shell: bash
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git add data_pipeline/update_daily_v2.py site/styles.css site/data/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: split ETF headline into two lines"
          git pull --rebase origin main
          git push origin HEAD:main
