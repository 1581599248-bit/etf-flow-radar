name: One-time public ETF flow benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-public-benchmark-once.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Run known public 2026-07-31 benchmark
        run: python data_pipeline/benchmark_known_public_20260731.py
