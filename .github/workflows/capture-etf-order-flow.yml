name: Capture ETF secondary trading facts

on:
  schedule:
    - cron: "35 7 * * 1-5"  # 15:35 Asia/Shanghai
    - cron: "5 8 * * 1-5"   # 16:05 Asia/Shanghai retry
    - cron: "35 8 * * 1-5"  # 16:35 Asia/Shanghai final retry
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trade date (YYYY-MM-DD); historical dates only work when the provider still exposes that date"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: capture-etf-secondary-trading
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Capture same-day ETF secondary-market aggressor statistics
        run: |
          if [ -n "${{ inputs.trade_date }}" ]; then
            python data_pipeline/capture_order_flow_v3.py --date "${{ inputs.trade_date }}"
          else
            python data_pipeline/capture_order_flow_v3.py
          fi
      - name: Commit immutable secondary-trading fact file
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git add site/data/order_flow
          git diff --cached --quiet && exit 0
          git commit -m "data: capture same-day ETF secondary trading facts"
          git push
