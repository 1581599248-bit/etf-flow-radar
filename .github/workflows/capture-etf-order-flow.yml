name: Capture ETF order flow

on:
  schedule:
    # Use off-peak minutes; each run also retries internally so one delayed cron
    # is sufficient to freeze the same-day trading fact.
    - cron: "37 7 * * 1-5"  # 15:37 Asia/Shanghai
    - cron: "17 8 * * 1-5"  # 16:17 Asia/Shanghai backup
    - cron: "7 9 * * 1-5"   # 17:07 Asia/Shanghai final backup
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trade date (YYYY-MM-DD); historical dates only work when provider still exposes that date"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: capture-etf-order-flow
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Capture same-day secondary-market ETF order flow
        shell: bash
        run: |
          attempts=1
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then attempts=7; fi
          for attempt in $(seq 1 "$attempts"); do
            set +e
            if [ -n "${{ inputs.trade_date }}" ]; then
              python data_pipeline/capture_order_flow_v2.py --date "${{ inputs.trade_date }}"
            else
              python data_pipeline/capture_order_flow_v2.py
            fi
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "capture attempt ${attempt}/${attempts} failed; retrying in 5 minutes"
              sleep 300
            fi
          done
          exit "$code"
      - name: Commit immutable order-flow fact file
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          git add site/data/order_flow
          git diff --cached --quiet && exit 0
          git commit -m "data: capture same-day ETF secondary order flow"
          git push
