name: Fix schema-v6 client validation v2

on:
  push:
    branches:
      - agent/fix-v6-client-validation

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - name: Make client validation migration-compatible without weakening flow checks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/rendered-html.test.mjs")
          text = path.read_text("utf-8")
          old = '''  const marketRecon = snapshot.quality.marketScopeReconciliation;
  assert.equal(marketRecon.aShareEquityPrimaryFlow1d, snapshot.market.flow1d);
  assert.ok(Number.isFinite(marketRecon.classifiedGroupPrimaryFlow1d));
  assert.ok(Number.isFinite(marketRecon.ungroupedDifference));'''
          new = '''  const marketRecon = snapshot.quality.marketScopeReconciliation;
  const reconMarketFlow = marketRecon.aShareEquityShareFlow1d ?? marketRecon.aShareEquityPrimaryFlow1d;
  const reconClassifiedFlow = marketRecon.classifiedGroupShareFlow1d ?? marketRecon.classifiedGroupPrimaryFlow1d;
  assert.equal(reconMarketFlow, snapshot.market.flow1d);
  assert.ok(Number.isFinite(reconClassifiedFlow));
  assert.ok(Number.isFinite(marketRecon.ungroupedDifference));'''
          if old not in text:
              raise SystemExit("reconciliation assertion block not found")
          text = text.replace(old, new, 1)

          replacements = {
              "assert.match(snapshot.methodology.metricSeparation, /两个不同变量/);":
                  "assert.match(snapshot.methodology.metricSeparation, /两句独立口径|两个不同变量/);",
              "assert.match(snapshot.methodology.scope, /全部ETF、股票ETF（含跨境）和A股股票ETF/);":
                  "assert.match(snapshot.methodology.scope, /A股股票ETF/);\n  assert.match(snapshot.methodology.scope, /股票ETF（含跨境）/);",
          }
          for old_text, new_text in replacements.items():
              if old_text not in text:
                  raise SystemExit(f"methodology assertion not found: {old_text}")
              text = text.replace(old_text, new_text, 1)
          path.write_text(text, "utf-8")

          workflow = Path(".github/workflows/postclose-etf-publish.yml")
          wtext = workflow.read_text("utf-8")
          marker = "name: Publish ETF report after close\n"
          replacement = "name: Publish ETF report after close\n# Publisher schema: v1; changes to this file bootstrap the latest captured trade date.\n"
          if "# Publisher schema: v1" not in wtext:
              if marker not in wtext:
                  raise SystemExit("publisher workflow header not found")
              wtext = wtext.replace(marker, replacement, 1)
              workflow.write_text(wtext, "utf-8")
          PY
      - run: pip install -r data_pipeline/requirements.txt
      - name: Run Python regression tests
        run: python -m unittest discover -s data_pipeline -p "test_*.py"
      - name: Run frontend validation against current published snapshot
        run: npm ci && npm test
      - name: Commit verified migration-compatible validation and remove temporary workflows
        run: |
          git config user.name "etf-flow-radar-bot"
          git config user.email "etf-flow-radar-bot@users.noreply.github.com"
          rm -f .github/workflows/agent-fix-v6-validation.yml .github/workflows/agent-fix-v6-validation-v2.yml
          git add tests/rendered-html.test.mjs .github/workflows/postclose-etf-publish.yml .github/workflows/agent-fix-v6-validation.yml .github/workflows/agent-fix-v6-validation-v2.yml
          git commit -m "test: support old and current schema-v6 reconciliation keys"
          git push
